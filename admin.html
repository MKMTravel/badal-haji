<style>
:root{--navy:#12206B;--blue:#1E32C8;--red:#C80000;--ink:#161B3B;--mute:#61688A;--line:#E0E4EE;--bg:#F1F3F8;--card:#fff;--soft:#F5F7FB;--ok:#137A41;--okS:#E5F5EC;--warn:#9A5B00;--warnS:#FFF3DC;--bad:#B42318;--badS:#FDECEA;--serif:"Source Serif 4",Georgia,serif;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 "Plus Jakarta Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hide{display:none!important}
a{color:var(--blue)}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lcard{width:100%;max-width:400px;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 20px 50px rgba(18,32,107,.12)}
.lhead{background:var(--navy);padding:26px 26px 22px;border-bottom:4px solid var(--red)}
.lhead img{height:46px;display:block}
.lbody{padding:26px}
.lbody h1{font-family:var(--serif);font-size:23px;margin:0 0 4px;color:var(--navy)}
.lbody p{margin:0 0 18px;color:var(--mute);font-size:13.5px}
.in{width:100%;height:46px;border:1px solid #C5CBDC;border-radius:8px;padding:0 13px;background:#fff;font-size:15px}
textarea.in{height:auto;min-height:90px;padding:11px 13px;resize:vertical}
.in:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(18,32,107,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border:0;border-radius:8px;background:var(--navy);color:#fff;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.btn.full{width:100%;height:48px;margin-top:12px}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid #C5CBDC}
.btn.red{background:#fff;color:var(--bad);border:1px solid #F0C4C0}
.btn.sm{height:34px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
.demo{background:var(--warnS);color:var(--warn);font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:8px;margin-top:14px}

/* shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--navy);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:22px 14px 18px}
.side .lg{padding:0 8px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px}
.side .lg img{height:38px;display:block}
.side .lg small{display:block;color:#AEB7EE;font-size:11.5px;margin-top:8px}
.nav{display:grid;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:#C9D0FF;padding:10px 12px;border-radius:8px;font-weight:600;cursor:pointer;text-align:left}
.nav button svg{flex:none;opacity:.85}
.nav button .b{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:800;border-radius:99px;padding:1px 7px}
.nav button.on{background:rgba(255,255,255,.12);color:#fff}
.side .foot{margin-top:auto;font-size:12px;color:#AEB7EE;padding:0 8px}
.side .foot button{margin-top:10px;width:100%;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:8px;padding:8px;font-weight:600;cursor:pointer}
.main{min-width:0;padding:26px 30px 40px}
.top{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-family:var(--serif);font-size:27px;margin:0;color:var(--navy);line-height:1.15}
.top p{margin:4px 0 0;color:var(--mute);font-size:13.5px}
.top .ta{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:#E9ECF8;color:var(--navy);white-space:nowrap}
.pill.ok{background:var(--okS);color:var(--ok)}.pill.warn{background:var(--warnS);color:var(--warn)}.pill.bad{background:var(--badS);color:var(--bad)}.pill.grey{background:#EEF0F4;color:#555C78}
.pill.red{background:var(--red);color:#fff}

/* cards */
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat span{display:block;font-size:12.5px;color:var(--mute);font-weight:600}
.stat b{display:block;font-size:26px;color:var(--navy);line-height:1.2;margin-top:4px;font-weight:800}
.stat small{display:block;font-size:12px;color:var(--mute)}
.stat.hl{border-color:var(--red);box-shadow:inset 3px 0 0 var(--red)}
.stat.hl b{color:var(--red)}
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card>h2{font-size:15px;margin:0;padding:14px 16px;border-bottom:1px solid var(--line);color:var(--navy);display:flex;align-items:center;gap:8px}
.card>h2 .pill{margin-left:auto}
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.todo li:last-child{border-bottom:0}
.todo .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--red)}
.todo .dot.w{background:#E0A100}
.todo .tx{flex:1;min-width:0}
.todo .tx b{display:block;font-size:14px}
.todo .tx small{color:var(--mute)}
.empty{padding:26px 16px;text-align:center;color:var(--mute);font-size:13.5px}

/* table */
.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.bar .in{max-width:300px;height:40px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid #CDD2E0;background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:#3B4166}
.chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chips button .n{opacity:.7;margin-left:4px}
.scroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--card)}
.t th{text-align:left;font-size:12px;color:var(--mute);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
.t td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr.rw{cursor:pointer}
.t tr.rw:hover td{background:#F7F8FD}
.t td small{display:block;color:var(--mute);font-size:12px}
.t .ref{font-weight:800;color:var(--navy);white-space:nowrap}
.av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12.5px;overflow:hidden;position:relative}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.xl{width:84px;height:84px;font-size:24px}
.phup{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.phup .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:1;min-width:220px}
.phup small{display:block;width:100%;font-size:12px;color:var(--mute);margin-top:6px}
.phup .busy{opacity:.55;pointer-events:none}
.av.lg{width:52px;height:52px;font-size:16px}
.who{display:flex;gap:10px;align-items:center}

/* drawer */
.drawer{position:fixed;inset:0;z-index:20}
.dback{position:absolute;inset:0;background:rgba(12,18,52,.45)}
.dpanel{position:absolute;right:0;top:0;bottom:0;width:min(620px,100%);background:var(--bg);overflow:auto;box-shadow:-10px 0 40px rgba(0,0,0,.15);padding-bottom:env(safe-area-inset-bottom,0px)}
.dh{position:sticky;top:0;z-index:2;background:var(--navy);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px}
.dh h3{margin:0;font-family:var(--serif);font-size:21px}
.dh small{display:block;color:#C3CAF5;font-size:12.5px}
.dh .x{margin-left:auto;border:0;background:rgba(255,255,255,.12);color:#fff;width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:18px}
.db{padding:16px 18px 30px;display:grid;gap:14px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.sec h4{margin:0 0 10px;font-size:13.5px;color:var(--navy);display:flex;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:0;font-size:13.5px}
.kv dt{color:var(--mute)}.kv dd{margin:0;font-weight:600;word-break:break-word}
.steps{display:flex;gap:4px}
.steps div{flex:1}
.steps i{display:block;height:5px;border-radius:99px;background:var(--line)}
.steps div.on i{background:var(--ok)}
.steps div.cur i{background:var(--red)}
.steps span{display:block;font-size:11.5px;color:var(--mute);margin-top:5px;font-weight:600}
.ulist{display:grid;gap:8px;margin-top:6px}
.uc{display:flex;gap:10px;align-items:flex-start;border:1px solid #CDD2E0;border-radius:8px;padding:10px 12px;cursor:pointer;background:#fff}
.uc input{margin-top:10px;accent-color:var(--navy)}
.uc.on{border-color:var(--navy);background:#F1F3FB;box-shadow:inset 3px 0 0 var(--navy)}
.uc.off{opacity:.55;cursor:not-allowed;background:var(--soft)}
.uc .m{font-size:12.5px;color:var(--mute)}
.uc b{font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note{border-radius:8px;padding:10px 12px;font-size:13px}
.note.info{background:#EEF1FC;color:var(--navy)}.note.warn{background:var(--warnS);color:var(--warn)}
.akadtx{white-space:pre-wrap;font-size:13px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:340px;overflow:auto;margin-top:10px}

/* modal */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px}
.modal .dback{position:absolute;inset:0}
.mbox{position:relative;width:min(680px,100%);max-height:92vh;overflow:auto;background:var(--card);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.mh h3{margin:0;font-family:var(--serif);font-size:20px;color:var(--navy)}
.mh .x{margin-left:auto;border:0;background:var(--soft);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:18px}
.mb{padding:18px 20px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.fg .full{grid-column:1/-1}
.fg label{display:block;font-size:12.5px;font-weight:700;color:#3B4166;margin-bottom:5px}
.fg label i{color:var(--red);font-style:normal}
.fg legend{grid-column:1/-1;font-size:12.5px;font-weight:800;color:var(--navy);padding-top:6px;border-top:1px solid var(--line);margin-top:4px;padding-top:12px}
.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(140%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;font-size:13.5px;transition:transform .25s;z-index:40;max-width:92vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.bad{background:var(--bad)}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite}
.spin.dk{border-color:rgba(18,32,107,.15);border-top-color:var(--navy);width:26px;height:26px}
@keyframes s{to{transform:rotate(360deg)}}
.loading{padding:60px;text-align:center}

@media (max-width:1180px){.stats{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}}
@media (max-width:820px){
 .app{grid-template-columns:minmax(0,1fr)}
 body{overflow-x:hidden}
 .side{position:sticky;height:auto;flex-direction:row;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;gap:10px;z-index:10}
 .side .lg{border:0;margin:0;padding:0}.side .lg img{height:28px}.side .lg small{display:none}
 .nav{display:flex;gap:2px;overflow-x:auto;min-width:0;flex:1}
 .nav button{padding:8px 10px;font-size:13px;white-space:nowrap}.nav button svg{display:none}
 .side .foot{display:none}
 .main{padding:18px 14px 40px}
 .top h1{font-size:23px}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .top .ta{margin-left:0}
 .stat b{font-size:22px}
 .kv{grid-template-columns:1fr}.kv dd{margin-bottom:6px}
 .fg{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* v2 tambahan */
.ta{position:relative}
.bell{position:relative;width:42px;height:42px;border-radius:10px;border:1px solid #C5CBDC;background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--navy)}
.bell .bd{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.bell.ring svg{animation:ring .9s ease-in-out 2}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
.ndrop{position:absolute;right:0;top:50px;width:min(380px,92vw);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(18,32,107,.18);z-index:15;overflow:hidden}
.ndrop .nh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ndrop .nh b{font-size:14px;color:var(--navy)}
.ndrop .nh button{margin-left:auto;border:0;background:none;color:var(--blue);font-weight:700;font-size:12.5px;cursor:pointer}
.nlist{max-height:380px;overflow:auto;list-style:none;margin:0;padding:0}
.nlist li{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.nlist li:hover{background:var(--soft)}
.nlist li.un{background:#F4F6FE}
.nlist .ni{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.nlist .ni.pay{background:var(--okS);color:var(--ok)}.nlist .ni.reg{background:#E9ECF8;color:var(--navy)}
.nlist .nt{flex:1;min-width:0;font-size:13px}
.nlist .nt b{display:block;font-size:13.5px}
.nlist .nt small{color:var(--mute)}
.nlist .ud{flex:none;width:8px;height:8px;border-radius:50%;background:var(--red);margin-top:6px}
.ndrop .nf{padding:10px 14px;background:var(--soft);font-size:12.5px;display:flex;gap:8px;flex-wrap:wrap}
.ndrop .nf button{border:1px solid #C5CBDC;background:#fff;border-radius:8px;padding:6px 10px;font-weight:600;font-size:12.5px;cursor:pointer}

.flowc{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px}
.flowc button{border:0;background:none;text-align:left;padding:14px 18px;cursor:pointer;position:relative;border-right:1px solid var(--line)}
.flowc button:last-child{border-right:0}
.flowc button:hover{background:var(--soft)}
.flowc span{display:block;font-size:12.5px;font-weight:700;color:var(--mute)}
.flowc b{display:block;font-size:28px;font-weight:800;color:var(--navy);line-height:1.2}
.flowc small{font-size:12px;color:var(--mute)}
.flowc button.hot b{color:var(--red)}
.flowc button::after{content:"";position:absolute;right:-7px;top:50%;width:12px;height:12px;background:var(--card);border-top:1px solid var(--line);border-right:1px solid var(--line);transform:translateY(-50%) rotate(45deg);z-index:1}
.flowc button:last-child::after{display:none}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;font-size:13.5px;color:var(--mute);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--navy);border-bottom-color:var(--navy)}
.tabs button .n{display:inline-block;margin-left:6px;font-size:11.5px;background:#E9ECF8;color:var(--navy);border-radius:99px;padding:1px 7px}
.tabs button .n.r{background:var(--red);color:#fff}

.qlist{display:grid;gap:10px}
.qc{display:grid;grid-template-columns:150px 1.2fr 1fr auto;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;transition:opacity .35s,transform .35s}
.qc.out{opacity:0;transform:translateX(30px)}
.qc .ref{font-weight:800;color:var(--navy)}
.qc small{display:block;color:var(--mute);font-size:12px}
.qc .amt{font-size:18px;font-weight:800;color:var(--navy)}
.qc .act{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.match{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--ok)}
.match.no{color:var(--bad)}

.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.ac{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:opacity .35s,transform .35s}
.ac.out{opacity:0;transform:scale(.96)}
.ac .ah{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--soft)}
.ac .ah .ref{font-weight:800;color:var(--navy)}
.ac .ah small{margin-left:auto;color:var(--mute);font-size:12px}
.ac .ab{padding:14px 16px;flex:1}
.ac .nm{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--navy);line-height:1.25}
.ac .meta{font-size:12.5px;color:var(--mute);margin-top:4px}
.ac .af{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.ac .af select{flex:1;height:40px;min-width:0}
.sumbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sumbar div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--mute)}
.sumbar b{color:var(--navy);font-size:17px;margin-right:4px}

.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;border-top:4px solid var(--ok)}
.pc.busy{border-top-color:var(--navy)}.pc.off{border-top-color:#B8BDCC}.pc.bad{border-top-color:var(--red)}
.pc .pt{display:flex;gap:12px;align-items:center;padding:16px 16px 12px}
.pc .pt .av{width:58px;height:58px;font-size:18px}
.pc .pn{flex:1;min-width:0}
.pc .pn b{display:block;font-size:15.5px;line-height:1.3}
.pc .pn small{display:block;color:var(--mute);font-size:12px}
.pc .badges{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 12px}
.pc dl{display:grid;grid-template-columns:92px 1fr;gap:5px 10px;margin:0;padding:12px 16px;border-top:1px solid var(--line);font-size:13px}
.pc dt{color:var(--mute)}.pc dd{margin:0;font-weight:600}
.pc .tug{margin:0 16px 12px;padding:10px 12px;border-radius:8px;font-size:13px;background:var(--soft)}
.pc .tug b{display:block;color:var(--navy)}
.pc .tug.free{background:var(--okS);color:var(--ok);font-weight:700}
.pc .pf{margin-top:auto;display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.pc .pf .btn{flex:1}
@media (max-width:980px){.qc{grid-template-columns:1fr 1fr}.qc .act{grid-column:1/-1;justify-content:flex-start}.flowc{grid-template-columns:repeat(2,1fr)}.flowc button::after{display:none}}
@media (max-width:560px){.qc{grid-template-columns:1fr}.acards,.pcards{grid-template-columns:1fr}}

.pc .pn .pill{display:inline-flex}
/* v3 */
.side .lg img{height:auto;width:150px}
.lhead{background:#fff!important;border-bottom:4px solid var(--red);display:grid;place-items:center}
.lhead img{height:auto!important;width:190px}
.ngroup{font-size:11.5px;font-weight:700;color:#8F99D8;padding:14px 12px 4px}
.navb{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding-top:10px}
.side .foot{margin-top:10px}
.trk{display:flex;align-items:center}
.trk i{flex:none;width:11px;height:11px;border-radius:50%;background:#D5DAE7}
.trk i.on{background:var(--ok)}
.trk i.cur{background:#fff;border:2.5px solid var(--red);width:13px;height:13px}
.trk b{flex:none;width:16px;height:2px;background:#D5DAE7}
.trk b.on{background:var(--ok)}
.trkl{font-size:12px;font-weight:700;margin-top:5px}
.trkl.r{color:var(--red)}.trkl.g{color:var(--ok)}.trkl.w{color:var(--warn)}
.ibs{display:flex;gap:6px;justify-content:flex-end}
.ib{width:34px;height:34px;border:1px solid #C5CBDC;border-radius:8px;background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--navy);text-decoration:none}
.ib:hover{border-color:var(--navy);background:#F1F3FB}
.ib.wa{color:#128C4B}
.ib.wa:hover{border-color:#128C4B;background:#ECF8F1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:0 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.wam textarea{min-height:170px;font-size:14px;line-height:1.55}
.tpls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tpls button{border:1px solid #C5CBDC;background:#fff;border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.tpls button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.wa{background:#128C4B}
.rcpt{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rcpt .rh{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
.rcpt .rh b{font-size:15px}.rcpt .rh small{display:block;color:#C3CAF5;font-size:12px}
.rcpt .ramt{margin-left:auto;font-size:22px;font-weight:800}
.rcpt dl{display:grid;grid-template-columns:170px 1fr;margin:0;font-size:13.5px}
.rcpt dt,.rcpt dd{margin:0;padding:8px 16px;border-bottom:1px solid var(--line)}
.rcpt dt{color:var(--mute);background:var(--soft)}.rcpt dd{font-weight:600;word-break:break-all}
.chk{display:grid;gap:6px;margin:12px 0}
.chk div{display:flex;gap:8px;align-items:center;font-size:13.5px;font-weight:600}
.chk .y{color:var(--ok)}.chk .n{color:var(--bad)}
.abn .qc{grid-template-columns:150px 1.2fr 1fr auto}
.vbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.vbar div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--mute)}
.vbar b{color:var(--navy);font-size:17px;margin-right:4px}
/* kad pengendali */
.idc{width:100%;max-width:440px;aspect-ratio:85.6/54;border-radius:14px;overflow:hidden;background:#fff;border:1px solid #D9DEEA;box-shadow:0 10px 30px rgba(18,32,107,.12);display:flex;flex-direction:column;margin:0 auto;color:#161B3B}
.idc .it{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 8px;border-bottom:3px solid var(--red)}
.idc .it img{height:30px;width:auto}
.idc .it span{font-size:10px;font-weight:800;color:var(--navy);text-align:right;line-height:1.3}
.idc .ib2{flex:1;display:flex;gap:12px;padding:10px 14px;align-items:center}
.idc .ph{flex:none;width:78px;height:96px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:24px;overflow:hidden}
.idc .ph img{width:100%;height:100%;object-fit:cover}
.idc .inf{flex:1;min-width:0}
.idc .inf b{display:block;font-size:13.5px;line-height:1.25;color:var(--navy)}
.idc .inf .rl{font-size:10px;font-weight:700;color:var(--red);margin:2px 0 6px}
.idc .inf div{font-size:10.5px;line-height:1.45}
.idc .inf div span{color:#6B7194}
.idc .qr{flex:none;display:grid;justify-items:center;gap:3px;font-size:8.5px;color:#6B7194}
.idc .qr .q{width:84px;height:84px;display:grid;place-items:center;background:#fff}
.idc .qr .q img,.idc .qr .q canvas{width:84px!important;height:84px!important}
.idc .ifoot{background:var(--navy);color:#fff;font-size:9.5px;padding:5px 14px;display:flex;justify-content:space-between}
.pcase{display:grid;gap:8px}
.pcase>div{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:#fff}
.pcase>div:hover{border-color:var(--navy)}
.pcase small{color:var(--mute)}
.pc{cursor:pointer}
.pc .pf{cursor:default}
.kcount{display:flex;gap:8px;padding:0 16px 12px;font-size:12.5px;color:var(--mute)}
.kcount b{color:var(--navy)}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;padding:10mm}
  #printArea .idc{box-shadow:none;max-width:85.6mm;border:1px solid #999}
  .noprint{display:none!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

.trk2{display:grid;grid-template-columns:repeat(5,74px);position:relative}
.trk2 .tc{display:grid;justify-items:center;gap:4px;position:relative}
.trk2 .tc::before{content:"";position:absolute;top:5px;right:50%;width:100%;height:2px;background:#D5DAE7;z-index:0}
.trk2 .tc:first-child::before{display:none}
.trk2 .tc.lon::before{background:var(--ok)}
.trk2 i{position:relative;z-index:1;width:12px;height:12px;border-radius:50%;background:#D5DAE7;border:2px solid #fff;box-sizing:content-box;margin-top:-1px}
.trk2 .tc.on i{background:var(--ok)}
.trk2 .tc.cur i{background:#fff;border:2.5px solid var(--red)}
.trk2 span{font-size:10.5px;letter-spacing:-.01em;color:var(--mute);font-weight:600;white-space:nowrap}
.trk2 .tc.on span{color:var(--ok)}
.trk2 .tc.cur span{color:var(--red);font-weight:800}
.legend .lg{display:inline-block;width:10px;height:10px;border-radius:50%;background:#D5DAE7}
.legend .lg.on{background:var(--ok)}.legend .lg.cur{background:#fff;border:2px solid var(--red)}
.tact{margin-left:10px;border:0;background:#fff;color:var(--ink);font-weight:800;border-radius:6px;padding:4px 10px;cursor:pointer}
.toast{display:flex;align-items:center}

/* kad pengendali v4 */
.pgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.pc2{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.pc2:hover{border-color:#C5CBDC;box-shadow:0 8px 24px rgba(18,32,107,.08)}
.pc2::before{content:"";height:4px;background:var(--ok)}
.pc2.busy::before{background:var(--navy)}.pc2.off::before{background:#B8BDCC}.pc2.bad::before{background:var(--red)}
.pc2 .st{display:inline-flex;margin-top:7px;font-size:11px}
.pc2 header{display:flex;gap:12px;align-items:flex-start;padding:16px 16px 14px}
.pc2 header .av{width:50px;height:50px;font-size:16px}
.pc2 .nmw{min-width:0;flex:1}
.pc2 .nmw b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;line-height:1.3;min-height:2.6em}
.pc2 .nmw small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.pc2 .m3{display:grid;grid-template-columns:1fr 1.3fr .7fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--soft)}
.pc2 .m3 div{padding:10px 12px;border-right:1px solid var(--line);min-width:0}
.pc2 .m3 div:last-child{border-right:0}
.pc2 .m3 span{display:block;font-size:11px;color:var(--mute);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc2 .m3 b{display:block;font-size:14px;color:var(--navy);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc2 .m3 b small{font-size:11.5px;color:var(--mute);font-weight:600}
.pc2 .tok{color:var(--ok)!important}.pc2 .twarn{color:var(--warn)!important}.pc2 .tgrey{color:#7A8099!important}.pc2 .tbad{color:var(--bad)!important}
.pc2 .q2{display:grid;grid-template-columns:82px 1fr;gap:6px 10px;margin:0;padding:12px 16px;font-size:13px}
.pc2 .q2 dt{color:var(--mute)}
.pc2 .q2 dd{margin:0;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4;min-height:2.8em}
.pc2 .task{margin:0 16px 14px;border-radius:10px;padding:10px 12px;min-height:62px;display:flex;flex-direction:column;justify-content:center}
.pc2 .task span{font-size:11px;color:var(--mute);font-weight:600}
.pc2 .task b{font-size:13.5px}
.pc2 .task em{font-style:normal;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc2 .task.busy{background:#EEF1FB}.pc2 .task.busy b{color:var(--navy)}
.pc2 .task.free{background:var(--okS);color:var(--ok)}
.pc2 .task.bad{background:var(--badS);color:var(--bad)}
.pc2 .task.off{background:#EEF0F4;color:#666C86}
.pc2 footer{margin-top:auto;display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.pc2 footer .btn{flex:1}
</style>

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const ago = s => { const d = new Date(s); if(isNaN(d)) return ""; const m = Math.round((Date.now() - d) / 60000); if(m < 1) return "baru sahaja"; if(m < 60) return m + " minit lalu"; const h = Math.round(m / 60); if(h < 24) return h + " jam lalu"; return dt(s); };
const ini = n => String(n || "?").replace(/^(ustazah|ustaz|ust\.?|hj\.?|haji|hajah)\s+/i, "").split(/\s+/).filter(w => !/^(bin|binti|bt|b)$/i.test(w)).slice(0, 2).map(w => w[0]).join("").toUpperCase();
function toast(t, bad, act){ const e = $("toast"); e.innerHTML = esc(t) + (act ? ` <button class="tact" onclick="${act[1]}">${esc(act[0])}</button>` : ""); e.className = "toast show" + (bad ? " bad" : ""); clearTimeout(toast.h); toast.h = setTimeout(() => e.className = "toast", act ? 6000 : 3000); }

/* ---------- API (Supabase) ---------- */
async function api(action, data = {}){
  if(DEMO) return demoApi(action, data);
  const { data: s } = await SBC.auth.getSession();
  const tok = s && s.session ? s.session.access_token : "";
  if(!tok){ logout("Sila log masuk."); throw new Error("Sila log masuk."); }
  const r = await fetch(SUPABASE_URL + "/functions/v1/bh-admin-api", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + tok, apikey: SUPABASE_ANON_KEY }, body: JSON.stringify(Object.assign({ action }, data)) });
  const j = await r.json().catch(() => ({ ok: false, error: "Ralat pelayan (" + r.status + ")" }));
  if(j.auth === false){ logout(j.error); throw new Error(j.error); }
  if(!j.ok) throw new Error(j.error || "Ralat");
  return j;
}
async function login(){
  const em = $("em").value.trim(), pw = $("pw").value; if(!em || !pw) return;
  $("lbtn").disabled = true; $("lbtn").innerHTML = '<span class="spin"></span>'; $("lerr").textContent = "";
  try{
    if(!DEMO){ const { error } = await SBC.auth.signInWithPassword({ email: em, password: pw }); if(error) throw new Error("Emel atau kata laluan salah."); }
    const j = await api("admin_login"); STAF = j.staf || { nama: em };
    KEY = "1"; start();
  }catch(e){ $("lerr").textContent = e.message; KEY = ""; if(SBC) SBC.auth.signOut(); }
  $("lbtn").disabled = false; $("lbtn").textContent = "Masuk";
}
function logout(msg){
  KEY = ""; clearInterval(start.t); if(start.ch && SBC){ SBC.removeChannel(start.ch); start.ch = null; }
  if(SBC) SBC.auth.signOut();
  $("app").classList.add("hide"); $("login").classList.remove("hide"); if(msg) $("lerr").textContent = msg;
}
async function start(){
  $("login").classList.add("hide"); $("app").classList.remove("hide");
  $("fStaf").textContent = STAF ? STAF.nama : "";
  await load();
  clearInterval(start.t);
  start.t = setInterval(() => { if(!document.hidden) load({silent:true}); }, POLL_MS);
  if(SBC && !start.ch){
    let h = null; const kick = () => { clearTimeout(h); h = setTimeout(() => load({silent:true}), 800); };
    start.ch = SBC.channel("bh-admin").on("postgres_changes", { event: "*", schema: "public", table: "bh_pendaftaran" }, kick)
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "bh_checkin" }, kick).subscribe();
  }
  if(DEMO) setTimeout(() => demoNewPay(), 15000);
}
async function resume(){
  if(DEMO || !SBC) return;
  const { data: s } = await SBC.auth.getSession();
  if(!s || !s.session) return;
  try{ const j = await api("admin_login"); STAF = j.staf; KEY = "1"; start(); }catch(e){}
}
document.addEventListener("visibilitychange", () => { if(!document.hidden && KEY) load({silent:true}); });
const busy = () => !$("drawer").classList.contains("hide") || !$("modal").classList.contains("hide");
async function load(o = {}){
  if(!S.pendaftar.length && !o.silent) $("page").innerHTML = '<div class="loading"><span class="spin dk"></span></div>';
  try{
    const j = await api("admin_data");
    S.musim = j.musim; S.portal_url = j.portal_url || ""; S.portal_pb_url = j.portal_pb_url || ""; S.rukun_total = j.rukun_total || 14; S.bcl_url = j.bcl_url || "https://bcl.my"; S.pendaftar = j.pendaftar || []; S.pembadal = j.pembadal || [];
    await ppLoad();
    updateNotif(true);
    if(o.silent && busy()){ renderNav(); return; }
    render();
    if(o.manual) toast("Data dikemas kini");
    if(S.open && !o.silent){ const p = S.pendaftar.find(x => x.ref === S.open); if(p) openDrawer(p.ref); }
  }catch(e){ if(!o.silent) $("page").innerHTML = `<div class="card"><div class="empty">Data tidak dapat dimuat: ${esc(e.message)}</div></div>`; }
}

/* ---------- Status ---------- */
function stage(p){
  const sb = p.status_bayaran || "Belum Bayar";
  if(/^Semak/.test(sb)) return { k: "masalah", t: "Amaun tidak sepadan", c: "warn" };
  if(sb !== "Berjaya") return { k: "bayar", t: sb === "Gagal" ? "Bayaran gagal" : sb === "Dibatalkan" ? "Bayaran dibatalkan" : "Belum bayar", c: "grey" };
  if(p.ustaz_id) return { k: "ok", t: "Pengendali ditetapkan", c: "ok" };
  if(p.semakan === "Bermasalah") return { k: "masalah", t: "Bayaran bermasalah", c: "warn" };
  if(p.semakan !== "Disahkan") return { k: "sahkan", t: "Perlu semak bayaran", c: "bad" };
  return { k: "ustaz", t: "Perlu tetapkan pengendali", c: "bad" };
}
function gelaran(p){
  if(p.d_status !== "Meninggal dunia") return p.d_nama;
  const f = p.d_jantina ? p.d_jantina === "Perempuan" : /\bbinti\b|\bbt\.?\b/i.test(p.d_nama);
  return (f ? "Allahyarhamah " : "Allahyarham ") + p.d_nama;
}
const inMusim = () => S.pendaftar.filter(p => String(p.musim) === String(S.musim));
const by = k => inMusim().filter(p => stage(p).k === k);
const kesFor = pb => S.pendaftar.find(p => p.ustaz_id === pb.id && String(p.musim) === String(S.musim));
function sebabTakLayak(pb, p){
  const r = [];
  if(pb.status !== "Aktif") r.push("Tidak aktif");
  if(!String(pb.haji || "").trim()) r.push("Tiada rekod haji fardu");
  const k = S.pendaftar.find(x => x.ustaz_id === pb.id && String(x.musim) === String(p.musim) && x.ref !== p.ref);
  if(k) r.push("Sudah ditugaskan ke " + k.ref);
  return r;
}
const permitOk = pb => pb.permit_status === "Disahkan" && String(pb.permit_musim) === String(S.musim);
const tersedia = () => S.pembadal.filter(b => b.status === "Aktif" && String(b.haji).trim() && !kesFor(b));
const amtOk = p => (Number(p.amaun) || 0) + 0.009 >= (Number(p.harga) || 0);
const avatar = (b, cls) => `<div class="av ${cls||""}"><span>${esc(ini(b.nama))}</span>${b.gambar?`<img src="${esc(b.gambar)}" alt="" onerror="this.remove()">`:""}</div>`;
const waLink = (tel, msg) => { const n = String(tel || "").replace(/\D/g, ""); return n ? `https://wa.me/${n}${msg?"?text="+encodeURIComponent(msg):""}` : ""; };

/* ---------- Notifikasi ---------- */
const NKEY = "bh_seen_v2";
let SEEN = null, NOTIFIED = new Set(), FIRST = true;
function events(){
  const ev = [];
  S.pendaftar.forEach(p => {
    if(p.status_bayaran === "Berjaya") ev.push({ k: "pay:" + p.ref, t: p.tarikh_bayar || p.tarikh, type: "pay", ref: p.ref, title: `Bayaran diterima ${rm(p.amaun || p.harga)}`, sub: `${p.ref} | ${p.nama}` });
    ev.push({ k: "reg:" + p.ref, t: p.tarikh, type: "reg", ref: p.ref, title: "Pendaftaran baru", sub: `${p.ref} | ${gelaran(p)}` });
  });
  return ev.sort((a, b) => String(b.t).localeCompare(String(a.t)));
}
function updateNotif(fromLoad){
  const ev = events();
  if(SEEN === null){
    try{ const raw = localStorage.getItem(NKEY); SEEN = raw ? new Set(JSON.parse(raw)) : null; }catch(e){ SEEN = null; }
    if(SEEN === null){ SEEN = new Set(ev.map(e => e.k)); saveSeen(); }
  }
  const un = ev.filter(e => !SEEN.has(e.k));
  const fresh = un.filter(e => e.type === "pay" && !NOTIFIED.has(e.k));
  fresh.forEach(e => NOTIFIED.add(e.k));
  if(fromLoad && fresh.length && !FIRST) alertPay(fresh);
  if(FIRST && fresh.length && fromLoad) alertPay(fresh, true);
  FIRST = false;
  const n = un.length;
  $("bellN").textContent = n > 99 ? "99+" : n; $("bellN").classList.toggle("hide", !n);
  document.title = (n ? `(${n}) ` : "") + "Admin Badal Haji | MKM";
  if(!$("ndrop").classList.contains("hide")) renderNotif();
}
function saveSeen(){ try{ localStorage.setItem(NKEY, JSON.stringify([...SEEN].slice(-2000))); }catch(e){} }
function alertPay(list, quiet){
  const e = list[0];
  toast(list.length > 1 ? `${list.length} bayaran baru diterima` : `${e.title}: ${e.sub}`);
  $("bell").classList.remove("ring"); void $("bell").offsetWidth; $("bell").classList.add("ring");
  if(!quiet) beep();
  if("Notification" in window && Notification.permission === "granted"){
    try{ new Notification("Badal Haji MKM: " + (list.length > 1 ? list.length + " bayaran baru" : e.title), { body: list.length > 1 ? list.map(x => x.sub).join("\n") : e.sub }); }catch(err){}
  }
}
let AC = null;
function beep(){
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    [880, 1320].forEach((f, i) => { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = f; o.connect(g); g.connect(AC.destination);
      const t = AC.currentTime + i * 0.16; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.15, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15); o.start(t); o.stop(t + 0.16); });
  }catch(e){}
}
function toggleNotif(ev){
  ev.stopPropagation();
  const d = $("ndrop"); d.classList.toggle("hide");
  if(!d.classList.contains("hide")) renderNotif();
}
document.addEventListener("click", () => $("ndrop").classList.add("hide"));
function renderNotif(){
  const ev = events().slice(0, 25);
  const perm = "Notification" in window ? Notification.permission : "unsupported";

function trkState(p){
  const ver = p.semakan === "Disahkan" || !!p.ustaz_id;
  const full = (p.ci_n || 0) >= (S.rukun_total || 14);
  const done = [p.status_bayaran === "Berjaya" || /^Semak/.test(p.status_bayaran), ver, !!p.ustaz_id, full, full];
  const cur = done.findIndex(x => !x);
  return { done, cur };
}

async function verify(ref, keputusan, btn){
  let catatan = "";
  if(keputusan === "Bermasalah"){ catatan = prompt("Nyatakan masalah bayaran (contoh: amaun tidak sepadan, transaksi tidak dijumpai di BCL):"); if(catatan === null) return; }

  try{
    await api("admin_verify", { ref, keputusan, catatan });
    SEEN.add("pay:" + ref); saveSeen();
    const card = $("q_" + ref); if(card) card.classList.add("out");
    if(!$("modal").classList.contains("hide")) closeModal();
    if(keputusan === "Disahkan") toast(`${ref}: bayaran disahkan dan dipindah ke Agihan pengendali`, false, ["Agih sekarang", "S.agTab='baru';go('agihan')"]);
    else toast(`${ref}: ditanda bermasalah`);
    setTimeout(() => load(), 350);
  }catch(e){ toast(e.message, true); if(btn) btn.disabled = false; }
}

/* gambar profil pengendali: potong segi empat 600px, muat naik ke Supabase Storage (bucket awam bh-foto) */
function squareJpeg(file, size){
  return new Promise((res, rej) => { const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(img.width, img.height), c = document.createElement("canvas"); c.width = c.height = Math.min(size, s);
      c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error("Gambar tidak dapat diproses")), "image/jpeg", 0.86); };
    img.onerror = () => rej(new Error("Fail ini bukan gambar yang sah")); img.src = url; });
}
function pbPhotoShow(url){
  const nm = ($("pb_nama") && $("pb_nama").value) || "";
  $("pb_gambar").value = url; $("pbPrev").innerHTML = avatar({ nama: nm, gambar: url }, "xl");
  $("pbUp").textContent = url ? "Tukar gambar" : "Muat naik gambar"; $("pbDel").classList.toggle("hide", !url);

async function pbPhoto(inp){
  const f = inp.files && inp.files[0]; inp.value = ""; if(!f) return;
  if(f.size > 15 * 1024 * 1024){ toast("Gambar terlalu besar (maksimum 15MB).", true); return; }
  const up = $("pbUp"), sv = $("pbSave"); up.disabled = true; sv.disabled = true; up.innerHTML = '<span class="spin"></span> Memuat naik...';
  try{
    const blob = await squareJpeg(f, 600);
    let url;
    if(DEMO){ url = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); }); }
    else {
      const id = (window.PB_EDIT || "baru").replace(/[^A-Za-z0-9-]/g, "");
      const path = `pengendali/${id}-${Date.now()}.jpg`;
      const { error } = await SBC.storage.from("bh-foto").upload(path, blob, { contentType: "image/jpeg", cacheControl: "31536000", upsert: false });
      if(error) throw new Error(/row-level|security|not found|bucket/i.test(error.message) ? "Storan gambar belum disediakan. Jalankan SQL bh-foto dalam Supabase dahulu." : error.message);
      url = SBC.storage.from("bh-foto").getPublicUrl(path).data.publicUrl;
    }
    pbPhotoShow(url); toast("Gambar dimuat naik. Tekan Simpan untuk sahkan.");
  }catch(e){ toast(e.message || "Muat naik gagal", true); up.textContent = $("pb_gambar").value ? "Tukar gambar" : "Muat naik gambar"; }
  finally{ up.disabled = false; sv.disabled = false; }
}

async function ppApprove(ref){

  closeDrawer();

  set("kelulusan", [p.kelulusan, p.institusi].filter(Boolean).join(", "));
  set("pengalaman", p.pengalaman_musim != null ? `${p.pengalaman_musim} musim` + (p.pengalaman ? `. ${p.pengalaman}` : "") : p.pengalaman);
  set("bahasa", p.bahasa);
  set("catatan", `Dari permohonan ${p.ref}. Menetap: ${p.menetap || "-"} (${p.status_diri || "-"}). KP/pasport: ${p.no_id || "-"}.`);
  $("mbox").querySelector(".mb").insertAdjacentHTML("afterbegin", `<div class="note info" style="margin-bottom:12px">Maklumat diisi daripada permohonan <b>${esc(p.ref)}</b>. Semak, lengkapkan permit, kemudian tekan Simpan. Permohonan akan ditanda Diluluskan.</div>`);

  if(p.gambar_path || p._img){
    const up = $("pbUp"), sv = $("pbSave"); up.disabled = true; sv.disabled = true; up.innerHTML = '<span class="spin"></span> Menyalin gambar...';
    try{
      let url;
      if(DEMO){ url = p._img; }
      else {
        const { data: blob, error } = await SBC.storage.from(PP_BUCKET).download(p.gambar_path); if(error) throw error;
        const path = `pengendali/${ref.replace(/[^A-Za-z0-9-]/g, "")}-${Date.now()}.jpg`;
        const r = await SBC.storage.from("bh-foto").upload(path, blob, { contentType: "image/jpeg", cacheControl: "31536000", upsert: false }); if(r.error) throw r.error;
        url = SBC.storage.from("bh-foto").getPublicUrl(path).data.publicUrl;
      }
      pbPhotoShow(url);
    }catch(e){ toast("Gambar tidak dapat disalin, sila muat naik semula: " + (e.message || ""), true); up.textContent = "Muat naik gambar"; }
    finally{ up.disabled = false; sv.disabled = false; }
  }
}

    p.ustaz = b.nama; p.ustaz_id = b.id; p.tarikh_ustaz = new Date().toISOString(); return { ok: true };
  }
  if(action === "admin_pembadal_save"){
    const x = d.pembadal;
    if(x.id){ Object.assign(B.find(b => b.id === x.id), x); P.forEach(q => { if(q.ustaz_id === x.id) q.ustaz = x.nama; }); return { ok: true, id: x.id }; }
    x.id = "PB-" + String(B.length + 2).padStart(3, "0"); B.push(x); return { ok: true, id: x.id };
  }
  throw new Error("Tindakan tidak sah");
}

resume();
