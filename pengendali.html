<body>
<div id="app"><div class="loading"><span class="spin"></span><p>Memuatkan tugasan...</p></div></div>
<div class="toast" id="toast"></div>
<script>
const DEMO = !API_URL;
const Q = new URLSearchParams(location.search);
const AUTH = { pb: Q.get("pb") || "", k: Q.get("k") || "" };
const QKEY = "bh_pb_queue_" + AUTH.pb;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ini = n => String(n || "?").replace(/^(ustazah|ustaz)\s+/i, "").split(/\s+/).filter(w => !/^(bin|binti)$/i.test(w)).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const avatar = (u, cls) => `<div class="av ${cls||""}"><span>${esc(ini(u.nama))}</span>${u.gambar?`<img src="${esc(u.gambar)}" alt="" onerror="this.remove()">`:""}</div>`;
function toast(t, c){ const e = $("toast"); e.textContent = t; e.className = "toast show " + (c || ""); clearTimeout(toast.h); toast.h = setTimeout(() => e.className = "toast", 3400); }
function ring(pct, size, stroke, color, track){
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct / 100)}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;
}
/* tarikh Arab Saudi & Hijrah */
const HB = ["Muharam","Safar","Rabiulawal","Rabiulakhir","Jamadilawal","Jamadilakhir","Rejab","Syaaban","Ramadan","Syawal","Zulkaedah","Zulhijjah"];
function hijri(d){ try{ const p = new Intl.DateTimeFormat("en-u-ca-islamic-umalqura", { day: "numeric", month: "numeric", year: "numeric", timeZone: "Asia/Riyadh" }).formatToParts(d); const g = t => Number((p.find(x => x.type === t) || {}).value.replace(/\D/g, "")); const r = { d: g("day"), m: g("month"), y: g("year") }; return r.d && r.m && r.y ? r : null; }catch(e){ return null; } }
function ksa(s){ const d = new Date(s); if(isNaN(d)) return { hijri: "", tarikh: "-", masa: "" }; const h = hijri(d);
  return { hijri: hTxt(h), tarikh: d.toLocaleDateString("ms-MY", { day: "numeric", month: "short", year: "numeric", timeZone: "Asia/Riyadh" }), masa: d.toLocaleTimeString("ms-MY", { hour: "numeric", minute: "2-digit", timeZone: "Asia/Riyadh" }) }; }
function fromHijri(y, m, d){ const jd = Math.floor((11 * y + 3) / 30) + 354 * y + 30 * m - Math.floor((m - 1) / 2) + d + 1948440 - 385; const base = (jd - 2440587.5) * 864e5 + 12 * 36e5;
  for(let off = -4; off <= 4; off++){ const t = new Date(base + off * 864e5), h = hijri(t); if(h && h.y === y && h.m === m && h.d === d) return t; } return null; }
const EST = { ihram_umrah: [11, 20, 12, 7], tawaf_umrah: [11, 20, 12, 7], saie_umrah: [11, 20, 12, 7], tahallul_umrah: [11, 20, 12, 7], ihram_haji: [12, 8], wukuf: [12, 9], muzdalifah: [12, 9, null, null, "Malam 10 Zulhijjah"], aqabah: [12, 10], cukur_haji: [12, 10], ifadah: [12, 10, 12, 12], saie_haji: [12, 10, 12, 12], mina: [12, 11, 12, 13], dam: [12, 10, 12, 13], wada: [12, 13, 12, 14] };
function estimate(key, musim){
  const e = EST[key]; const y = Number(String(musim || "").match(/(\d{4})\s*H/i)?.[1] || 0); if(!e || !y) return "";
  const a = fromHijri(y, e[0], e[1]), b = e[2] ? fromHijri(y, e[2], e[3]) : null;
  const g = d => d ? d.toLocaleDateString("ms-MY", { day: "numeric", month: "short", timeZone: "Asia/Riyadh" }) : "";
  if(e[4]) return `${e[4]} ${y}H${a ? ` (malam ${g(a)})` : ""}`;
  if(b) return `${e[1]} ${HB[e[0]-1]} hingga ${e[3]} ${HB[e[2]-1]}${a && b ? ` (${g(a)} hingga ${g(b)})` : ""}`;
  return `${e[1]} ${HB[e[0]-1]} ${y}H${a ? ` (${g(a)})` : ""}`;
}
async function api(action, data){
  if(DEMO) return demo(action, data);
  const r = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=UTF-8" }, body: JSON.stringify(Object.assign({ action }, AUTH, data)) });
  return r.json();
}
async function uploadSigned(url, blob){
  if(DEMO) return;
  const fd = new FormData(); fd.append("cacheControl", "3600"); fd.append("", blob);
  const r = await fetch(url, { method: "PUT", headers: { "x-upsert": "false" }, body: fd });
  if(!r.ok) throw new Error("Muat naik gagal (" + r.status + ")");
}
function b64ToBlob(b64, mime){ const bin = atob(b64); const a = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: mime }); }
/* hantar satu check-in: minta pautan muat naik > muat naik bukti > rekod check-in */
async function sendItem(it){
  const u = await api("portal_upload", { ref: it.ref, rukun: it.rukun, mime: it.mime, size: it.blob.size });
  if(!u.ok) throw Object.assign(new Error(u.error || "Ralat"), { server: true });
  if(u.dup) return { ok: true, dup: true };
  await uploadSigned(u.upload_url, it.blob);
  const j = await api("portal_checkin", { ref: it.ref, rukun: it.rukun, path: u.path, mime: it.mime, lat: it.lat, lng: it.lng, acc: it.acc, ts: it.ts, nota: it.nota });
  if(!j.ok) throw Object.assign(new Error(j.error || "Ralat"), { server: true });
  return j;
}

let D = null, SEL = "", NIAT = "", PHASE = "", GPS = null, FILE = null, SENDING = false;
async function load(){
  const j = await api("portal_pb", {});
  if(!j.ok){ $("app").innerHTML = `<div class="failbox"><b>${esc(j.error)}</b><p>Sila hubungi admin MKM untuk pautan baharu.</p></div>`; return; }
  D = j; if(!SEL || !D.kes.find(k => k.ref === SEL)) SEL = D.kes[0] ? D.kes[0].ref : "";
  render();
}
const kes = () => D.kes.find(k => k.ref === SEL);
function nextIdx(k){ const done = new Set(k.checkin.map(c => c.k)); return D.rukun.findIndex(r => !done.has(r.k)); }
function pickCase(ref){ SEL = ref; NIAT = ""; PHASE = ""; FILE = null; render(); }
function evThumb(c){
  if(!c || (!c.url && !c.bukti)) return "";
  const href = c.url || "#";
  if(c.jenis === "Video") return `<a class="ev vid" href="${esc(href)}" target="_blank" rel="noopener"><span>Video</span></a>`;
  return `<a class="ev" href="${esc(href)}" target="_blank" rel="noopener">${c.thumb?`<img src="${esc(c.thumb)}" alt="" loading="lazy">`:'<span>Gambar</span>'}</a>`;
}

function getGPS(force){
  if(!("geolocation" in navigator)){ GPS = { s: "bad", msg: "Peranti tidak menyokong GPS." }; render(); return; }
  if(force || !GPS){ GPS = { s: "wait" }; if(force) render(); }
  navigator.geolocation.getCurrentPosition(p => { GPS = { s: "ok", lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }; render(); },
    e => { GPS = { s: "bad", msg: e.code === 1 ? "Sila benarkan akses lokasi dalam tetapan browser." : "Cuba di kawasan terbuka." }; render(); },
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 });
}
async function pick(inp){
  const f = inp.files[0]; if(!f) return;
  const ts = Date.now();
  try{
    if(f.type.startsWith("image")){ const data = await compress(f); FILE = { mime: "image/jpeg", data, blob: b64ToBlob(data, "image/jpeg"), url: "data:image/jpeg;base64," + data, ts }; }
    else { if(f.size > 25 * 1024 * 1024){ toast("Video terlalu besar (maksimum 25MB). Rakam 10 hingga 20 saat sahaja.", "bad"); return; }
      FILE = { mime: f.type || "video/mp4", blob: f, url: URL.createObjectURL(f), ts }; }
    render(); setTimeout(() => { const s = $("sendBtn"); if(s) s.scrollIntoView({ behavior: "smooth", block: "center" }); }, 60);
  }catch(e){ toast("Fail tidak dapat dibaca. Cuba semula.", "bad"); }
}
function b64(f){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(f); }); }
function compress(f){ return new Promise((res, rej) => { const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => { const s = Math.min(1, 1600 / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.82).split(",")[1]); };
  img.onerror = rej; img.src = url; }); }
async function send(ref, rukun){
  if(SENDING || !FILE) return;
  const it = { ref, rukun, mime: FILE.mime, blob: FILE.blob, lat: GPS && GPS.s === "ok" ? GPS.lat : "", lng: GPS && GPS.s === "ok" ? GPS.lng : "", acc: GPS && GPS.acc || "", ts: FILE.ts, nota: window.NOTA || "" };
  if(!it.lat && !confirm("Lokasi GPS tidak diperoleh. Check-in akan ditanda untuk semakan admin. Teruskan?")) return;
  SENDING = true; const b = $("sendBtn"); b.disabled = true; b.innerHTML = '<span class="spin sm"></span> Menghantar...';
  try{
    const j = await sendItem(it);
    FILE = null; window.NOTA = ""; GPS = null; NIAT = ""; PHASE = "";
    toast(j.dalam === false ? "Check-in diterima. Lokasi akan disemak admin." : "Alhamdulillah, check-in diterima.", "ok");
    await load();
  }catch(e){
    if(e.server) toast(e.message, "bad");
    else {
      let data = FILE.data;
      if(!data && FILE.blob.size < 2.5e6) data = await b64(FILE.blob);
      if(data){ const { blob, ...meta } = it; addQueue({ ...meta, data }); FILE = null; markLocal(it); toast("Tiada internet. Check-in disimpan dan akan dihantar automatik."); }
      else toast("Tiada internet dan video terlalu besar untuk disimpan. Cuba semula bila ada line.", "bad");
    }
  }
  SENDING = false; render();
}
function queue(){ try{ return JSON.parse(localStorage.getItem(QKEY) || "[]"); }catch(e){ return []; } }
function addQueue(it){ const q = queue(); q.push(it); try{ localStorage.setItem(QKEY, JSON.stringify(q)); }catch(e){ toast("Storan telefon penuh. Hantar bila ada internet.", "bad"); } }
function markLocal(it){ const k = D.kes.find(x => x.ref === it.ref); if(k && !k.checkin.find(c => c.k === it.rukun)) k.checkin.push({ k: it.rukun, masa: new Date(it.ts).toISOString(), lokasi: "Menunggu dihantar", dalam: false }); }
async function flushQueue(manual){
  const q = queue(); if(!q.length) return; const left = [];
  for(const it of q){
    try{ await sendItem({ ...it, blob: b64ToBlob(it.data, it.mime) }); }
    catch(e){ left.push(it); if(manual && e.server) toast(e.message, "bad"); }
  }
  localStorage.setItem(QKEY, JSON.stringify(left));
  if(left.length < q.length){ toast(`${q.length - left.length} check-in berjaya dihantar.`, "ok"); await load(); }
  else if(manual) toast("Masih tiada sambungan internet.", "bad");
}
window.addEventListener("online", () => flushQueue());
setInterval(() => { if(navigator.onLine) flushQueue(); }, 30000);

const DM = { ci: null };
function demo(action, d){
  const R = [["ihram_umrah","Ihram umrah & niat","Umrah","Rukun","Miqat"],["tawaf_umrah","Tawaf umrah","Umrah","Rukun","Masjidil Haram"],["saie_umrah","Sa'ie umrah","Umrah","Rukun","Mas'a, Masjidil Haram"],["tahallul_umrah","Bercukur / bergunting (tahallul umrah)","Umrah","Rukun","Makkah"],["ihram_haji","Ihram haji & niat (8 Zulhijjah)","Haji","Rukun","Makkah / Mina"],["wukuf","Wukuf di Arafah (9 Zulhijjah)","Haji","Rukun","Padang Arafah"],["muzdalifah","Mabit di Muzdalifah","Haji","Wajib","Muzdalifah"],["aqabah","Lontar Jamrah Aqabah (10 Zulhijjah)","Haji","Wajib","Jamarat, Mina"],["cukur_haji","Bercukur / bergunting (tahallul awal)","Haji","Rukun","Mina / Makkah"],["ifadah","Tawaf Ifadah","Haji","Rukun","Masjidil Haram"],["saie_haji","Sa'ie haji","Haji","Rukun","Mas'a, Masjidil Haram"],["mina","Mabit di Mina & lontar tiga jamrah","Haji","Wajib","Mina"],["dam","Sembelihan dam Tamattu'","Haji","Wajib","Tanah Haram"],["wada","Tawaf Wada'","Haji","Wajib","Masjidil Haram"]].map(r => ({ k:r[0], n:r[1], f:r[2], j:r[3], t:r[4] }));

const hY = y => LANG === "en" ? `${y} AH` : `${y}H`;

  return { hijri: hTxt(h), tarikh: d.toLocaleDateString(LOC(), { day: "numeric", month: "short", year: "numeric", timeZone: "Asia/Riyadh" }), masa: d.toLocaleTimeString(LOC(), { hour: "numeric", minute: "2-digit", timeZone: "Asia/Riyadh" }) }; }

  const to = LANG === "en" ? "to" : "hingga";
  if(e[4]) return LANG === "en" ? `Night of 10 ${hMonth(12)} ${hY(y)}${a ? ` (night of ${g(a)})` : ""}` : `${e[4]} ${y}H${a ? ` (malam ${g(a)})` : ""}`;

      <p style="font-size:12px;color:var(--mute);margin:10px 0 0">${t("wa_note")}</p></div></section></div>`;
}

function niatHtml(k){

/* ===== peta lokasi (Leaflet + OpenStreetMap / satelit Esri) ===== */
let MAP = null, MK = null, CIRC = null, MAPEL = null, PIN = null, TILES = null;
const SITES = [["Masjidil Haram", 21.4225, 39.8262], ["Mas'a", 21.4237, 39.8274], ["Jamarat", 21.4206, 39.8730], ["Mina", 21.4133, 39.8933], ["Muzdalifah", 21.3833, 39.9367], ["Arafah", 21.3549, 39.9841],
  ["Masjid Namirah", 21.3536, 39.9667], ["Miqat Qarnul Manazil (As-Sail)", 21.6328, 40.4251], ["Miqat Bir Ali (Zulhulaifah)", 24.4136, 39.5431], ["Miqat Juhfah", 22.7036, 39.1453], ["Miqat Yalamlam", 20.5167, 39.8667],
  ["Miqat Zatu Irq", 21.9333, 40.4333], ["Masjid Tan'im (Aisyah)", 21.4672, 39.8106], ["Ji'ranah", 21.5622, 39.9558], ["Madinah", 24.4672, 39.6111]];
function hav(a, b, c, d){ const R = 6371000, r = x => x * Math.PI / 180; const x = Math.sin(r(c - a) / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(r(d - b) / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); }
function nearest(p){ let best = null; for(const s of SITES){ const m = hav(p.lat, p.lng, s[1], s[2]); if(!best || m < best.m) best = { n: s[0], m }; } return best; }
const fmtM = m => m < 1000 ? `${Math.round(m)} m` : `${(m / 1000).toFixed(m < 10000 ? 1 : 0)} km`;
function curLoc(){ if(PIN && PIN.manual) return PIN; if(GPS && GPS.s === "ok") return { lat: GPS.lat, lng: GPS.lng, manual: false }; return null; }
function locHtml(){
  const p = curLoc(), g = GPS || { s: "wait" };
  const st = p && p.manual ? `<span class="dot" style="background:#E0A100"></span><span>${t("gps_manual")}</span>`
    : g.s === "ok" ? `<span class="dot"></span><span>${t("gps_ok")(Math.round(g.acc))}</span>`
    : g.s === "bad" ? `<span class="dot"></span><span>${t("gps_bad")} ${esc(g.msg || "")}</span>` : `<span class="dot"></span><span>${t("gps_wait")}</span>`;
  const nb = p ? nearest(p) : null;
  return `<div class="gps ${p && p.manual ? "wait" : g.s}">${st}</div>
    ${p ? `<div class="near">${IC.pin}<span>${esc(t("near")(nb.n, fmtM(nb.m)))}</span><a href="https://www.google.com/maps?q=${p.lat.toFixed(6)},${p.lng.toFixed(6)}" target="_blank" rel="noopener">${t("gmaps")}</a></div>
      <div class="coord">${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</div>` : ""}
    ${p && p.manual ? `<div class="mwarn">${t("manual_warn")}</div>` : ""}`;
}
function updLoc(){ const e = $("locBox"); if(e) e.innerHTML = locHtml(); }
function setPin(lat, lng, manual){ PIN = { lat, lng, manual }; updLoc(); syncMap(false); }
function useGps(){ PIN = null; getGPS(true); }
function pinIcon(){ return L.divIcon({ className: "pinx", html: '<span></span>', iconSize: [30, 40], iconAnchor: [15, 38] }); }
function loadLeaflet(){
  if(window.L) return Promise.resolve();
  if(loadLeaflet.p) return loadLeaflet.p;
  loadLeaflet.p = new Promise((res, rej) => {
    const c = document.createElement("link"); c.rel = "stylesheet"; c.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(c);
    const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"; s.onload = res; s.onerror = () => { loadLeaflet.p = null; rej(); }; document.head.appendChild(s);
  });
  return loadLeaflet.p;
}
function mountMap(){
  const slot = $("mapSlot"); if(!slot) return;
  if(!MAPEL){ MAPEL = document.createElement("div"); MAPEL.className = "map"; }
  slot.appendChild(MAPEL);
  loadLeaflet().then(() => {
    if(!MAP){
      const c = curLoc() || { lat: 21.4225, lng: 39.8262 };
      MAP = L.map(MAPEL, { zoomControl: true }).setView([c.lat, c.lng], curLoc() ? 17 : 13);
      const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" });
      const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: "&copy; Esri" });
      TILES = { osm, sat }; osm.addTo(MAP);
      MAP.on("click", e => setPin(e.latlng.lat, e.latlng.lng, true));
    }
    if(TILES){ if(MAP._lc) MAP.removeControl(MAP._lc);
      const C = L.Control.extend({ onAdd(){ const d = L.DomUtil.create("div", "mtog"); L.DomEvent.disableClickPropagation(d);
        const on = MAP.hasLayer(TILES.sat) ? "sat" : "osm";
        d.innerHTML = `<button type="button" class="${on==="osm"?"on":""}" data-l="osm">${t("map")}</button><button type="button" class="${on==="sat"?"on":""}" data-l="sat">${t("sat")}</button>`;
        d.onclick = e => { const l = e.target.getAttribute("data-l"); if(!l) return; const o = l === "osm" ? "sat" : "osm"; if(MAP.hasLayer(TILES[o])) MAP.removeLayer(TILES[o]); TILES[l].addTo(MAP); d.querySelectorAll("button").forEach(x => x.classList.toggle("on", x.getAttribute("data-l") === l)); };
        return d; } });
      MAP._lc = new C({ position: "topright" }).addTo(MAP); }
    syncMap(true); setTimeout(() => MAP && MAP.invalidateSize(), 80);
  }).catch(() => { MAPEL.innerHTML = `<div class="mapfail">${t("mapfail")}</div>`; });
}
function syncMap(recenter){
  if(!MAP) return;
  const p = curLoc();
  if(GPS && GPS.s === "ok"){ if(!CIRC) CIRC = L.circle([GPS.lat, GPS.lng], { radius: Math.max(GPS.acc, 5), color: "#1E32C8", weight: 1, fillOpacity: .12 }).addTo(MAP); else CIRC.setLatLng([GPS.lat, GPS.lng]).setRadius(Math.max(GPS.acc, 5)); }
  if(!p) return;
  if(!MK){ MK = L.marker([p.lat, p.lng], { draggable: true, icon: pinIcon() }).addTo(MAP); MK.on("dragend", () => { const ll = MK.getLatLng(); setPin(ll.lat, ll.lng, true); }); }
  else MK.setLatLng([p.lat, p.lng]);
  if(recenter || !p.manual) MAP.setView([p.lat, p.lng], Math.max(MAP.getZoom(), 16));
}

function sheetHtml(k){
  const R = D.rukun, ni = nextIdx(k), r = R[ni]; if(!r) return "";
  return `<div class="sheet" role="dialog" aria-modal="true" aria-label="Check-in">
    <div class="shd"><button onclick="closeSheet()">${IC.back} ${t("back")}</button><b>${t("sh_t")(ni + 1, R.length)}</b></div>
    <div class="sbd"><div class="sin">
      <section class="card"><div class="cb"><div class="sst"><span class="no">${ni + 1}</span><div><b>${esc(stepName(r))}</b><small>${esc(tw(r.t))} · ${esc(jen(r.j))} · ${esc(k.ref)}</small><div class="est"><b>${t("est")}:</b> ${esc(estimate(r.k, k.musim))}</div></div></div></div></section>
      <section class="card"><div class="cb form2">
        <div class="fs"><i>1</i><div><b>${t("loc")}</b><div id="locBox">${locHtml()}</div><div id="mapSlot"></div>
          <div class="maprow"><span>${t("map_hint")}</span><button type="button" onclick="useGps()">${IC.gps} ${t("use_gps")}</button></div></div></div>
        <div class="fs"><i>2</i><div><b>${t("proof")}</b>${FILE ? `<div class="prev">${FILE.mime.startsWith("video") ? `<video src="${FILE.url}" controls playsinline></video>` : `<img src="${FILE.url}" alt="">`}<button onclick="FILE=null;render()">${t("change2")}</button></div>`
          : `<div class="cap"><label>${IC.ci.replace("<svg ", '<svg width="26" height="26" ')}${t("photo")}<input type="file" accept="image/*" capture="environment" onchange="pick(this)"></label>
            <label><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M22 8l-6 4 6 4z"/></svg>${t("video")}<input type="file" accept="video/*" capture="environment" onchange="pick(this)"></label></div>
            <div class="say">${t("say2")(esc(k.nama_asal))}</div>`}</div></div>
        <div class="fs"><i>3</i><div><b>${t("note")} <span style="font-weight:500;color:var(--mute)">${t("opt")}</span></b><textarea class="in" id="nota" oninput="window.NOTA=this.value" placeholder="${esc(t("note_ph"))}">${esc(window.NOTA || "")}</textarea></div></div>
      </div></section>
      ${niatCard(k)}
      ${guideCard(k, false)}
    </div></div>
    <div class="sft"><button class="btn send" id="sendBtn" onclick="send('${esc(k.ref)}','${esc(r.k)}')" ${FILE ? "" : "disabled"}>${FILE ? t("send") : t("needfile")}</button></div>
  </div>`;
}

/* ===== fungsi dengan teks dwibahasa (menggantikan versi asal) ===== */
async function load(){
  const j = await api("portal_pb", {});
  if(!j.ok){ $("app").innerHTML = `<div class="failbox"><b>${esc(j.error)}</b><p>${t("newlink")}</p></div>`; return; }
  D = j; if(!SEL || !D.kes.find(k => k.ref === SEL)) SEL = D.kes[0] ? D.kes[0].ref : "";
  render();
}
function getGPS(force){
  if(!("geolocation" in navigator)){ GPS = { s: "bad", msg: t("g_nosup") }; updLoc(); return; }
  if(force || !GPS){ GPS = { s: "wait" }; updLoc(); }
  navigator.geolocation.getCurrentPosition(p => { GPS = { s: "ok", lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }; updLoc(); syncMap(!(PIN && PIN.manual)); },
    e => { GPS = { s: "bad", msg: e.code === 1 ? t("g_perm") : t("g_open") }; updLoc(); },
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 30000 });
}
async function pick(inp){
  const f = inp.files[0]; if(!f) return;
  const ts = Date.now();
  try{
    if(f.type.startsWith("image")){ const data = await compress(f); FILE = { mime: "image/jpeg", data, blob: b64ToBlob(data, "image/jpeg"), url: "data:image/jpeg;base64," + data, ts }; }
    else { if(f.size > 25 * 1024 * 1024){ toast(t("vbig"), "bad"); return; }
      FILE = { mime: f.type || "video/mp4", blob: f, url: URL.createObjectURL(f), ts }; }
    render();
  }catch(e){ toast(t("fbad"), "bad"); }
}
async function send(ref, rukun){
  if(SENDING || !FILE) return;
  const p = curLoc();
  const nota = [window.NOTA || "", p && p.manual ? "[Lokasi dipin manual pada peta]" : ""].filter(Boolean).join(" ");
  const it = { ref, rukun, mime: FILE.mime, blob: FILE.blob, lat: p ? p.lat : "", lng: p ? p.lng : "", acc: p && !p.manual && GPS ? GPS.acc || "" : "", ts: FILE.ts, nota };
  if(!it.lat && !confirm(t("nogps"))) return;
  SENDING = true; const b = $("sendBtn"); b.disabled = true; b.innerHTML = `<span class="spin sm"></span> ${t("sending")}`;
  try{
    const j = await sendItem(it);
    FILE = null; window.NOTA = ""; GPS = null; PIN = null; NIAT = ""; PHASE = ""; SHEET = false; document.body.classList.remove("noscroll");
    toast(j.dalam === false ? t("ok2") : t("ok"), "ok");
    await load();
  }catch(e){
    if(e.server) toast(e.message, "bad");
    else {
      let data = FILE.data;
      if(!data && FILE.blob.size < 2.5e6) data = await b64(FILE.blob);
      if(data){ const { blob, ...meta } = it; addQueue({ ...meta, data }); FILE = null; SHEET = false; document.body.classList.remove("noscroll"); markLocal(it); toast(t("off")); }
      else toast(t("off2"), "bad");
    }
  }
  SENDING = false; render();
}
function addQueue(it){ const q = queue(); q.push(it); try{ localStorage.setItem(QKEY, JSON.stringify(q)); }catch(e){ toast(t("full"), "bad"); } }
async function flushQueue(manual){
  const q = queue(); if(!q.length) return; const left = [];
  for(const it of q){
    try{ await sendItem({ ...it, blob: b64ToBlob(it.data, it.mime) }); }
    catch(e){ left.push(it); if(manual && e.server) toast(e.message, "bad"); }
  }
  localStorage.setItem(QKEY, JSON.stringify(left));
  if(left.length < q.length){ toast(t("sent")(q.length - left.length), "ok"); await load(); }
  else if(manual) toast(t("still"), "bad");
}

load().catch(() => { $("app").innerHTML = `<div class="failbox"><b>${t("conn")}</b><p>${t("retry")}</p></div>`; });
</script>
