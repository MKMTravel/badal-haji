<style>
:root{--navy:#12206B;--blue:#1E32C8;--red:#C80000;--ink:#151A3A;--mute:#626A8C;--line:#E1E5EF;--bg:#F1F3F8;--card:#fff;--soft:#F6F7FB;--ok:#137A41;--okS:#E5F5EC;--warn:#9A5B00;--warnS:#FFF3DC;--bad:#B42318;--badS:#FDECEA;--serif:"Source Serif 4",Georgia,serif;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hide{display:none!important}
.av{flex:none;width:56px;height:56px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:#E9ECF8;color:var(--navy);white-space:nowrap}
.pill.ok{background:var(--okS);color:var(--ok)}.pill.warn{background:var(--warnS);color:var(--warn)}.pill.grey{background:#EEF0F4;color:#555C78}.pill.blue{background:#E6EAFD;color:var(--blue)}
.ev{display:block;position:relative;border-radius:10px;overflow:hidden;background:linear-gradient(150deg,#12206B,#1E32C8);text-decoration:none;aspect-ratio:4/3}
.ev img{width:100%;height:100%;object-fit:cover;display:block}
.ev span{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.ev.vid span::before{content:"";border-left:13px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-right:6px;display:inline-block;vertical-align:-2px}
.cert{background:#FFFDF7;border-radius:8px;padding:10px}
.cert .cin{border:2px solid var(--navy);outline:1px solid var(--navy);outline-offset:4px;padding:26px 20px;text-align:center}
.cert img{height:54px;width:auto}
.cert h3{font-family:var(--serif);font-size:22px;color:var(--navy);margin:14px 0 4px}
.cert .clead{font-size:13.5px;color:#4a5072}
.cert .cnm{font-family:var(--serif);font-size:22px;font-weight:700;margin:8px 0}
.cert .cdet{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;text-align:left;font-size:12.5px;max-width:460px;margin:16px auto 0}
.cert .cdet span{display:block;color:#6b7194;font-size:11px}
.failbox{max-width:520px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px;text-align:center;color:var(--mute)}
.failbox b{display:block;color:var(--ink);font-size:16px}
.vwrap{max-width:520px;margin:30px auto;padding:0 14px}
.vcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px 24px;text-align:center}
.vcard .vav{width:96px;height:96px;font-size:28px;margin:0 auto 12px}
.vcard h1{font-family:var(--serif);font-size:24px;margin:0;color:var(--navy)}
.vid2{color:var(--mute);font-size:13px}
.vok{display:inline-flex;align-items:center;gap:8px;background:var(--okS);color:var(--ok);font-weight:800;padding:8px 16px;border-radius:99px;margin:12px 0}
.vbad{background:var(--badS);color:var(--bad);display:inline-flex;padding:8px 16px;border-radius:99px;font-weight:800}
.vkv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;text-align:left;font-size:14px;margin:8px 0 0}
.vkv dt{color:var(--mute)}.vkv dd{margin:0;font-weight:600}
.vts{font-size:12.5px;color:var(--mute);margin:16px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;text-decoration:none}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid #C5CBDC}
.btn.wa{background:#128C4B}
.demo{background:var(--warnS);color:var(--warn);font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:10px}
.spin{display:inline-block;width:28px;height:28px;border:3px solid rgba(18,32,107,.15);border-top-color:var(--navy);border-radius:50%;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.loading{text-align:center;padding:80px 20px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
/* hero (C) */
.hero{background:var(--navy);color:#fff;position:relative;overflow:hidden;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 88px}
.hero::before{content:"";position:absolute;right:-120px;top:-140px;width:420px;height:420px;border-radius:50%;border:56px solid rgba(30,50,200,.5)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--red)}
.hero .in{max-width:1180px;margin:0 auto;position:relative;z-index:1}
.hero .bar{display:flex;align-items:center;gap:14px}
.hero .bar img{height:42px;width:auto}
.hero .bar .tt{border-left:1px solid rgba(255,255,255,.25);padding-left:14px;font-size:12.5px;color:#C3CAF5;line-height:1.35}
.hero .bar .tt b{display:block;color:#fff;font-size:14.5px}
.hero .bar .rf{margin-left:auto;font-size:12px;color:#C3CAF5;text-align:right}
.hero .bar .rf b{display:block;color:#fff;font-size:14px;letter-spacing:.02em}
.hero .main{display:flex;align-items:center;gap:28px;margin-top:30px;flex-wrap:wrap}
.hero .rw{position:relative;flex:none}
.hero .rw div{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.hero .rw b{display:block;font-size:30px;line-height:1}
.hero .rw small{display:block;font-size:11.5px;color:#C3CAF5;margin-top:4px}
.hero .txt{flex:1;min-width:240px}
.hero .txt small{color:#C3CAF5;font-size:13px}
.hero h1{font-family:var(--serif);font-size:34px;line-height:1.15;margin:4px 0 10px}
.hero .chips{display:flex;gap:8px;flex-wrap:wrap}
.hero .chips span{font-size:12.5px;font-weight:600;background:rgba(255,255,255,.12);padding:5px 12px;border-radius:99px}
.hero .chips span.st{background:#fff;color:var(--navy);font-weight:800}
.wrapd{max-width:1180px;margin:-60px auto 0;padding:0 16px 30px;position:relative;z-index:2}
.phbar{background:#fff;border-radius:16px;box-shadow:0 12px 34px rgba(18,32,107,.12);display:grid;grid-template-columns:repeat(5,1fr);overflow:hidden;margin-bottom:18px}
.phbar div{padding:16px 14px;border-right:1px solid var(--line);position:relative}
.phbar div:last-child{border-right:0}
.phbar div::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--line)}
.phbar .on::after{background:var(--ok)}.phbar .cur::after{background:var(--red)}
.phbar span{display:block;font-size:11.5px;font-weight:700;color:var(--mute)}
.phbar b{display:block;font-size:14px;margin-top:2px;line-height:1.3}
.phbar small{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.phbar .on span{color:var(--ok)}.phbar .cur span{color:var(--red)}
/* lajur (A) */
.lay{display:grid;grid-template-columns:350px minmax(0,1fr);gap:18px;align-items:start}
.col{display:grid;gap:16px}
.side{position:sticky;top:16px}
.box{background:#fff;border:1px solid var(--line);border-radius:16px}
.box>h2{margin:0;padding:14px 18px;border-bottom:1px solid var(--line);font-size:15px;color:var(--navy);display:flex;align-items:center;gap:8px}
.box>h2 .pill,.box>h2 .tg{margin-left:auto}
.bx{padding:16px 18px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:7px 12px;margin:0;font-size:13.5px}
.kv dt{color:var(--mute)}.kv dd{margin:0;font-weight:600}
.pbh{display:flex;gap:14px;align-items:center}
.pbh .av{width:64px;height:64px;font-size:20px}
.pbh .lb{font-size:11.5px;font-weight:700;color:var(--mute)}
.pbh b{display:block;font-family:var(--serif);font-size:18.5px;color:var(--navy);line-height:1.25}
.pbh small{color:var(--mute);font-size:12.5px}
.chips2{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.note{font-size:12.5px;color:var(--mute);background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:12px}
.ver{display:block;text-align:center;margin-top:12px;height:40px;line-height:38px;border:1px solid #C5CBDC;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--navy);text-decoration:none}
.ver:hover{border-color:var(--navy);background:#F1F3FB}
/* togol paparan */
.tg{display:inline-flex;border:1px solid #C5CBDC;border-radius:10px;overflow:hidden}
.tg button{border:0;background:#fff;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--mute);cursor:pointer}
.tg button.on{background:var(--navy);color:#fff}
.ph2{padding:4px 18px 16px}
.ph2 h3{font-size:13px;color:var(--navy);margin:14px 0 10px;display:flex;align-items:center;gap:8px}
.ph2 h3 .pill{font-size:11px}
.ph2 h3::after{content:"";flex:1;height:1px;background:var(--line);order:1}
.ph2 h3 .pill{order:2}
.intro{margin:12px 0 0;color:var(--mute);font-size:13.5px}
/* jubin (C) */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;background:#fff}
.tile .ev{border-radius:0;aspect-ratio:16/10}
.tile .ph{aspect-ratio:16/10;display:grid;place-items:center;background:var(--soft);color:#A0A6BF;font-size:12px;font-weight:700}
.tile.cur{border-color:var(--red);box-shadow:0 0 0 3px rgba(200,0,0,.08)}
.tile.cur .ph{background:#FFF5F5;color:var(--red)}
.tile .tb{padding:12px 14px;display:grid;gap:4px;flex:1}
.tile .hdr{display:flex;align-items:center;gap:8px}
.tile .no{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:800;background:#EEF0F4;color:#8A90AA}
.tile.on .no{background:var(--ok);color:#fff}.tile.cur .no{background:var(--red);color:#fff}
.tile .hdr .pill{margin-left:auto;font-size:10.5px;padding:1px 8px}
.tile .nm{font-weight:700;font-size:14px;line-height:1.35}
.tile:not(.on) .nm{color:#6E7493}
.tile .w{font-size:12px;color:var(--mute)}
.tile .loc{font-size:12px;font-weight:700}
.tile .loc.ok{color:var(--ok)}.tile .loc.warn{color:var(--warn)}
/* senarai (A) */
.row{display:grid;grid-template-columns:34px minmax(0,1fr) 120px;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .no{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12.5px;background:#EEF0F4;color:#8A90AA}
.row.on .no{background:var(--ok);color:#fff}
.row.cur .no{background:#fff;border:2.5px solid var(--red);color:var(--red)}
.row .t{font-weight:700;font-size:14.5px;line-height:1.35}
.row:not(.on) .t{color:#6E7493}
.row .t .pill{font-size:10.5px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.row .w{font-size:12.5px;color:var(--mute);margin-top:2px}
.row .w .pill{margin-left:6px;font-size:11px}
.row .ev{width:120px}
.row .ph{width:120px;aspect-ratio:4/3;border-radius:10px;border:1.5px dashed #D5DAE7;display:grid;place-items:center;font-size:11.5px;color:#A0A6BF;text-align:center}
.row.cur .ph{border-color:#F3B4B4;color:var(--red)}
.foot{text-align:center;font-size:12px;color:var(--mute);line-height:1.7;padding:20px 0 10px}
@media (max-width:1000px){
 .lay{display:flex;flex-direction:column;gap:14px}
 .side,.main{display:contents}
 .o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}
}
@media (max-width:820px){.phbar{grid-template-columns:1fr 1fr}.phbar div{border-bottom:1px solid var(--line)}.hero h1{font-size:27px}.hero .main{gap:18px}.hero .bar .tt{display:none}}
@media (max-width:480px){.tiles{grid-template-columns:1fr 1fr}.tile .nm{font-size:13px}.kv{grid-template-columns:1fr}.kv dd{margin-bottom:5px}.row{grid-template-columns:30px minmax(0,1fr) 84px;gap:10px}.row .ev,.row .ph{width:84px}.ph2{padding:4px 12px 14px}}
@media print{.hero,.phbar,.box:not(#sijil),.foot{display:none!important}.wrapd{margin:0}.lay{display:block}}
/* v2: fasa, tarikh, muat turun */
.ptabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ptab{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;cursor:pointer}
.ptab .pi{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#EEF0F4;color:var(--navy)}
.ptab.done .pi{background:var(--ok);color:#fff}
.ptab .px{flex:1;min-width:0}
.ptab .px b{display:block;font-size:15px;color:var(--navy)}
.ptab .px small{display:block;font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptab .pb2{display:block;height:5px;border-radius:99px;background:var(--line);margin-top:7px;overflow:hidden}
.ptab .pb2 i{display:block;height:100%;background:var(--ok)}
.ptab .pc{font-weight:800;font-size:15px;color:var(--navy)}
.ptab.on{background:var(--navy);border-color:var(--navy)}
.ptab.on .px b,.ptab.on .pc{color:#fff}.ptab.on .px small{color:#C3CAF5}
.ptab.on .pi{background:#fff;color:var(--navy)}.ptab.on.done .pi{background:#4ADE80;color:var(--navy)}
.ptab.on .pb2{background:rgba(255,255,255,.2)}.ptab.on .pb2 i{background:#4ADE80}
.tz{font-size:12px;color:var(--mute);margin:10px 0 12px;padding:8px 12px;background:var(--soft);border-radius:10px}
.dt b{display:block;font-size:12.5px;color:var(--navy)}
.dt span{display:block;font-size:11.5px;color:var(--mute)}
.est{font-size:12px;color:var(--warn);background:var(--warnS);border-radius:8px;padding:6px 8px;line-height:1.4}
.est span{display:block;font-size:10.5px;font-weight:800;text-transform:none}
.row .est,.row .dt{margin-top:3px}
.pnav{display:flex;justify-content:center;margin-top:14px}
.sj .dl{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.sj .dl .btn{flex:1;min-width:220px}
.dlh{font-size:12px;color:var(--mute);margin:10px 0 0}
.spin.sm{width:16px;height:16px;border-width:2.5px;border-color:rgba(255,255,255,.35);border-top-color:#fff}
.btn.ghost .spin.sm{border-color:rgba(18,32,107,.2);border-top-color:var(--navy)}
@media (max-width:620px){.ptabs{grid-template-columns:1fr}}
/* ===== v3: susunan senarai ringkas (mudah alih) + pilihan bahasa ===== */
.av{position:relative}
.av span{position:relative}
.av img{position:absolute;inset:0}
.app{max-width:640px;margin:0 auto;padding-bottom:24px}
.top{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 8px}
.top .tin{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.top .lg{height:34px;width:auto}
.top .tt{font-size:11.5px;color:#C3CAF5;line-height:1.3;border-left:1px solid rgba(255,255,255,.25);padding-left:12px}
.top .tt b{display:block;color:#fff;font-size:13px}
.lang{margin-left:auto;display:inline-flex;background:rgba(255,255,255,.12);border-radius:10px;padding:3px;gap:2px}
.lang button{border:0;background:transparent;color:#C3CAF5;font-weight:800;font-size:12px;padding:6px 10px;border-radius:8px;cursor:pointer}
.lang button.on{background:#fff;color:var(--navy)}
.hz{background:var(--navy);color:#fff;padding:10px 16px 52px;position:relative;overflow:hidden}
.hz::before{content:"";position:absolute;right:-110px;top:-160px;width:320px;height:320px;border-radius:50%;border:44px solid rgba(30,50,200,.45)}
.hz .hin{position:relative;max-width:640px;margin:0 auto}
.hz small{color:#C3CAF5;font-size:12.5px}
.hz h1{font-family:var(--serif);font-size:23px;line-height:1.2;margin:2px 0 10px;text-wrap:balance}
.hz .chips{display:flex;gap:6px;flex-wrap:wrap}
.hz .chips span{font-size:11.5px;font-weight:700;background:rgba(255,255,255,.14);padding:3px 10px;border-radius:99px}
.hz .chips span.st{background:#fff;color:var(--navy)}
.pad{padding:0 14px;display:grid;gap:12px}
.lift{margin-top:-38px;position:relative}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card>h2{margin:0;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px;color:var(--navy);display:flex;align-items:center;gap:8px}
.card>h2 .pill{margin-left:auto}
.cb{padding:12px 16px}
.pg{box-shadow:0 14px 34px rgba(18,32,107,.14);border:0}
.pg .row1{display:flex;align-items:baseline;gap:8px}
.pg .row1 b{font-size:26px;line-height:1;color:var(--navy)}
.pg .row1 span{font-size:13.5px;color:var(--mute);font-weight:600}
.bar{height:8px;border-radius:99px;background:#E7EAF3;overflow:hidden;margin:10px 0 12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#17A34A,#4ADE80);border-radius:99px}
.nxt{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:12px;padding:10px 12px}
.nxt .nn{flex:none;width:30px;height:30px;border-radius:9px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.nxt .lb{font-size:11px;font-weight:800;color:var(--red);text-transform:uppercase;letter-spacing:.04em}
.nxt b{display:block;font-size:14px;line-height:1.3}
.nxt small{display:block;font-size:12px;color:var(--warn);margin-top:2px}
.nxt.ok{background:var(--okS)}.nxt.ok .nn{background:var(--ok)}.nxt.ok .lb{color:var(--ok)}
.tl{display:grid}
.tl .r{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;font-size:13.5px;position:relative}
.tl .r i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#EEF0F4;color:#A0A6BF;font-style:normal;font-size:11px;font-weight:800;position:relative;z-index:1}
.tl .r.on i{background:var(--ok);color:#fff}
.tl .r.cur i{background:#fff;border:2.5px solid var(--red)}
.tl .r:not(:last-child)::after{content:"";position:absolute;left:10px;top:28px;bottom:-8px;width:2px;background:var(--line)}
.tl .r.on:not(:last-child)::after{background:#9FD9B5}
.tl .r b{font-weight:700}
.tl .r:not(.on) b{color:#6E7493}
.tl .r.cur b{color:var(--ink)}
.tl .r small{font-size:12px;color:var(--mute);text-align:right}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 8px;font-weight:700;font-size:13.5px;color:var(--mute);cursor:pointer;display:flex;justify-content:center;gap:6px;align-items:center}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(18,32,107,.1)}
.seg button i{font-style:normal;font-size:12px;font-weight:800;background:#E9ECF8;color:var(--navy);border-radius:99px;padding:1px 7px}
.seg button i.ok{background:var(--okS);color:var(--ok)}
.tip{font-size:12px;color:var(--mute);background:var(--soft);border-radius:10px;padding:8px 11px;margin:10px 0 4px}
.it{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .no{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;background:#EEF0F4;color:#8A90AA}
.it.ok .no{background:var(--ok);color:#fff}
.it.cur .no{background:#fff;border:2.5px solid var(--red);color:var(--red)}
.it .t{font-weight:700;font-size:14px;line-height:1.35}
.it:not(.ok) .t{color:#5E6488}
.it.cur .t{color:var(--ink)}
.it .t .pill{font-size:10px;padding:1px 7px;margin-left:5px;vertical-align:1px}
.it .d{font-size:12px;color:var(--navy);font-weight:700;margin-top:2px}
.it .d span{font-weight:500;color:var(--mute)}
.it .e{font-size:12px;color:var(--warn);margin-top:2px}
.it .l{font-size:11.5px;font-weight:700;margin-top:1px}
.it .l{color:var(--mute)}.it .l.ok{color:var(--ok)}
.it .ev{width:58px;aspect-ratio:1;border-radius:10px}
.it .ev span{font-size:10px}
.it .ph{width:58px;aspect-ratio:1;border-radius:10px;border:1.5px dashed #D5DAE7;display:grid;place-items:center;font-size:10px;color:#A0A6BF;text-align:center;line-height:1.2;padding:2px}
.it.cur .ph{border-color:#F3B4B4;color:var(--red)}
.us{display:flex;gap:12px;align-items:center}
.us .av{width:56px;height:56px;font-size:17px}
.us b{display:block;font-size:15.5px;color:var(--navy);line-height:1.3}
.us small{color:var(--mute);font-size:12px}
.chips2{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.kv2{display:grid;grid-template-columns:minmax(92px,36%) 1fr;gap:7px 12px;margin:12px 0 0;font-size:13.5px}
.kv2 dt{color:var(--mute)}.kv2 dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.note2{font-size:12px;color:var(--mute);background:var(--soft);border-radius:10px;padding:9px 11px;margin-top:12px}
.cert2 p{margin:0 0 12px;font-size:13.5px}
.cert2 .dl{display:grid;gap:8px}
.cert2 .btn{width:100%}
.cert2 small{display:block;font-size:11.5px;color:var(--mute);margin-top:8px}
.waf{width:100%;height:50px}
@media (min-width:700px){body{padding:18px 0}.app{border-radius:22px;overflow:hidden;box-shadow:0 20px 60px rgba(18,32,107,.14);background:var(--bg)}}
.foot2{text-align:center;font-size:11.5px;color:var(--mute);line-height:1.7;padding:16px 14px 0}

</style>
</head>

const DEMO = !API_URL;
const Q = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rm = n => "RM" + (Number(n) || 0).toLocaleString("en-MY");
const dtt = s => { if(!s) return "-"; const d = new Date(s); return isNaN(d) ? esc(s) : d.toLocaleString("ms-MY", {day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit"}); };
const dt = s => { if(!s) return "-"; const d = new Date(s); return isNaN(d) ? esc(s) : d.toLocaleDateString("ms-MY", {day:"numeric", month:"long", year:"numeric"}); };
const ini = n => String(n || "?").replace(/^(ustazah|ustaz)\s+/i, "").split(/\s+/).filter(w => !/^(bin|binti)$/i.test(w)).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const avatar = (u, cls) => `<div class="av ${cls||""}"><span>${esc(ini(u.nama))}</span>${u.gambar?`<img src="${esc(u.gambar)}" alt="" onerror="this.remove()">`:""}</div>`;

async function api(action, data){
  if(DEMO) return demo(action, data);
  const r = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=UTF-8" }, body: JSON.stringify(Object.assign({ action }, data)) });
  return r.json();
}
function fail(msg){ $("app").innerHTML = `<div class="failbox"><b>${esc(msg)}</b><p>Sila semak pautan yang diterima melalui WhatsApp atau hubungi MKM.</p></div>`; }

/* bukti: gambar / video (pautan sementara dari storan Supabase) */
function evThumb(c, cls){
  if(!c || (!c.url && !c.bukti)) return "";
  const href = c.url || "#";
  if(c.jenis === "Video") return `<a class="ev vid ${cls||""}" href="${esc(href)}" target="_blank" rel="noopener" aria-label="Lihat video bukti"><span>Video</span></a>`;
  return `<a class="ev ${cls||""}" href="${esc(href)}" target="_blank" rel="noopener" aria-label="Lihat gambar bukti">${c.thumb?`<img src="${esc(c.thumb)}" alt="" loading="lazy">`:'<span>'+(typeof LANG!=="undefined"&&LANG==="en"?"Photo":"Gambar")+'</span>'}</a>`;
}

/* model data untuk semua layout */
let DATA = null;
function model(){
  const { kes: k, pengendali: u, rukun: R, checkin: C } = DATA;
  const done = Object.fromEntries(C.map(c => [c.k, c]));
  const n = C.length, total = R.length, full = n >= total, pct = Math.round(n / total * 100);
  const nextR = R.find(r => !done[r.k]);
  const steps = [
    { t: "Bayaran diterima", on: k.paid, s: k.paid ? dtt(k.tarikh_bayar) : "Menunggu bayaran" },
    { t: "Bayaran disahkan", on: k.disahkan, s: k.disahkan ? dtt(k.tarikh_sah) : "Dalam semakan MKM" },
    { t: "Pengendali ditugaskan", on: !!u, s: u ? dt(k.tarikh_ustaz) : "Akan dimaklumkan" },
    { t: "Pelaksanaan ibadah", on: full, s: n ? `${n}/${total} selesai` : `Musim ${k.musim}` },
    { t: "Sijil pelaksanaan", on: full, s: full ? "Telah dikeluarkan" : "Selepas semua selesai" }
  ];
  const cur = steps.findIndex(s => !s.on);
  const status = full ? { t: "Selesai", c: "ok" } : n ? { t: "Dalam pelaksanaan", c: "blue" } : u ? { t: "Menunggu musim haji", c: "blue" } : k.disahkan ? { t: "Menunggu pengendali", c: "warn" } : k.paid ? { t: "Bayaran dalam semakan", c: "warn" } : { t: "Belum bayar", c: "grey" };
  const items = R.map((r, i) => ({ ...r, no: i + 1, c: done[r.k], cur: nextR && nextR.k === r.k && !!u }));
  const wa = DATA.telefon_mkm ? `https://wa.me/${String(DATA.telefon_mkm).replace(/\D/g,"")}?text=${encodeURIComponent(`Assalamualaikum MKM. Saya ingin bertanya tentang badal haji ${k.nama} (${k.ref}).`)}` : "";
  return { k, u, R, C, done, n, total, full, pct, nextR, steps, cur, status, items, wa };
}
function ring(pct, size, stroke, color, track){
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct / 100)}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;
}
function certHtml(m){
  const { k, u, done } = m;
  return `<div class="cert"><div class="cin"><img src="${LOGO_C}" alt="MKM Badal Haji"><h3>Sijil Pelaksanaan Badal Haji</h3><div class="clead">Dengan ini disahkan bahawa ibadah haji telah disempurnakan bagi pihak</div><div class="cnm">${esc(k.nama)}</div>
    <div class="cdet"><div><span>No. rujukan</span><b>${esc(k.ref)}</b></div><div><span>Musim</span><b>${esc(k.musim)}</b></div><div><span>Dilaksanakan oleh</span><b>${esc(u ? u.nama : "-")}</b></div><div><span>Jenis haji</span><b>Haji ${esc(k.jenis_haji)}</b></div>
    <div><span>Wukuf di Arafah</span><b>${done.wukuf ? ksa(done.wukuf.masa).hijri || ksa(done.wukuf.masa).tarikh : "-"}</b></div><div><span>Tawaf Ifadah</span><b>${done.ifadah ? ksa(done.ifadah.masa).hijri || ksa(done.ifadah.masa).tarikh : "-"}</b></div></div></div></div>`;
}

/* semakan pengendali (QR) */
async function verifyView(pb){
  const j = await api("portal_verify", { pb });
  if(!j.ok){ $("app").innerHTML = `<div class="failbox"><span class="vbad">&#10007; Tidak dijumpai</span><p>${esc(j.error)}</p></div>`; return; }
  const b = j.pengendali;
  $("app").innerHTML = `<div class="vwrap"><div class="vcard">${avatar(b, "vav")}<h1>${esc(b.nama)}</h1><div class="vid2">${esc(b.id)}</div>
    ${b.aktif ? `<div class="vok">&#10003; Pengendali badal haji sah MKM</div>` : `<div class="vok vbad">&#10007; Tidak aktif</div>`}
    <dl class="vkv"><dt>Haji fardu</dt><dd>${esc(b.haji || "-")}</dd><dt>Kelulusan</dt><dd>${esc(b.kelulusan || "-")}</dd><dt>Pengalaman</dt><dd>${esc(b.pengalaman || "-")}</dd><dt>Permit ${esc(j.musim)}</dt><dd>${esc(b.permit)}</dd></dl>
    <p class="vts">Disemak ${dtt(new Date().toISOString())}</p></div></div>`;
}

async function load(){
  const j = await api("portal_waris", { ref: Q.get("ref"), t: Q.get("t") });
  if(!j.ok) return fail(j.error || "Pautan tidak sah.");
  DATA = j; render(model());

function hijri(d){
  try{
    const p = new Intl.DateTimeFormat("en-u-ca-islamic-umalqura", { day: "numeric", month: "numeric", year: "numeric", timeZone: "Asia/Riyadh" }).formatToParts(d);
    const g = t => Number((p.find(x => x.type === t) || {}).value.replace(/\D/g, ""));
    const r = { d: g("day"), m: g("month"), y: g("year") };
    return r.d && r.m && r.y ? r : null;
  }catch(e){ return null; }
}
/* masa check-in dalam waktu Arab Saudi */
function ksa(s){
  const d = new Date(s); if(isNaN(d)) return esc(s || "-");
  const h = hijri(d);
  return { hijri: hTxt(h), tarikh: gTxt(d), masa: tTxt(d), full: `${h ? hTxt(h) + " | " : ""}${gTxt(d)}, ${tTxt(d)}` };
}
/* cari tarikh Masihi bagi tarikh Hijrah (kalendar Umm al-Qura) */
function fromHijri(y, m, d){
  const jd = Math.floor((11 * y + 3) / 30) + 354 * y + 30 * m - Math.floor((m - 1) / 2) + d + 1948440 - 385;
  const base = (jd - 2440587.5) * 864e5 + 12 * 36e5;
  for(let off = -4; off <= 4; off++){
    const t = new Date(base + off * 864e5), h = hijri(t);
    if(h && h.y === y && h.m === m && h.d === d) return t;
  }
  return null;
}

/* ---------- PDF ---------- */
function loadPdfLib(){
  if(window.html2pdf) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
async function makePdf(html, width, orientation, filename, btn){
  const lbl = btn ? btn.innerHTML : "";
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spin sm"></span> Menyediakan PDF...'; }
  const box = document.createElement("div");
  box.style.cssText = `position:fixed;left:-20000px;top:0;width:${width}px;background:#fff`;
  box.innerHTML = html; document.body.appendChild(box);
  try{
    await loadPdfLib();
    await window.html2pdf().set({ margin: 0, filename, image: { type: "jpeg", quality: 0.96 }, html2canvas: { scale: 2, useCORS: true, backgroundColor: "#ffffff" }, jsPDF: { unit: "mm", format: "a4", orientation }, pagebreak: { mode: ["css", "legacy"], avoid: "tr" } }).from(box.firstElementChild).save();
  }catch(e){
    const w = window.open("", "_blank");
    if(w){ w.document.write(`<html><head><title>${esc(filename)}</title><style>@page{size:A4 ${orientation};margin:0}body{margin:0}</style></head><body>${html}</body></html>`); w.document.close(); setTimeout(() => w.print(), 600); }
  }finally{ box.remove(); if(btn){ btn.disabled = false; btn.innerHTML = lbl; } }
}

  const a = fromHijri(y, e[0], e[1]), b = e[2] ? fromHijri(y, e[2], e[3]) : null;
  const g = d => d ? d.toLocaleDateString(LOC(), { day: "numeric", month: "short", year: "numeric", timeZone: "Asia/Riyadh" }) : "";
  const to = LANG === "en" ? "to" : "hingga";
  if(e[4]) return LANG === "en" ? `Night of 10 ${hMonth(12)} ${hY(y)}${a ? ` (night of ${g(a)})` : ""}` : `${e[4]} ${y}H${a ? ` (malam ${g(a)})` : ""}`;
  if(b) return `${e[1]} ${hMonth(e[0])} ${to} ${e[3]} ${hMonth(e[2])} ${hY(y)}${a && b ? ` (${g(a)} ${to} ${g(b)})` : ""}`;
  return `${e[1]} ${hMonth(e[0])} ${hY(y)}${a ? ` (${g(a)})` : ""}`;
}
const dtL = s => { if(!s) return "-"; const d = new Date(s); return isNaN(d) ? esc(s) : d.toLocaleDateString(LOC(), { day: "numeric", month: "short", year: "numeric" }); };

let PHASE = "";
function setPhase(p){ PHASE = p; render(model()); }
function render(m){
  const { k, u, n, total, pct, status, items, full, wa } = m;
  document.documentElement.lang = LANG;
  const U = items.filter(i => i.f === "Umrah"), H = items.filter(i => i.f === "Haji");
  const dU = U.filter(i => i.c).length, dH = H.filter(i => i.c).length;
  if(!PHASE) PHASE = dU < U.length ? "Umrah" : "Haji";
  const L = PHASE === "Umrah" ? U : H;
  const nextIt = items.find(i => !i.c);
  const stT = full ? T("st_done") : n ? T("st_run") : u ? T("st_season") : k.disahkan ? T("st_ustaz") : k.paid ? T("st_check") : T("st_unpaid");
  const jen = j => j === "Rukun" ? T("rukun") : j === "Wajib" ? T("wajib") : j;
  const reg = [
    { t: T("s1"), on: k.paid, s: k.paid ? dtL(k.tarikh_bayar) : T("pend") },
    { t: T("s2"), on: k.disahkan, s: k.disahkan ? dtL(k.tarikh_sah) : k.paid ? T("review") : "" },
    { t: T("s3"), on: !!u, s: u ? dtL(k.tarikh_ustaz) : T("later") },
    { t: T("s4"), on: full, s: T("nsteps")(n, total) },
    { t: T("s5"), on: full, s: full ? T("issued") : T("after") }
  ];
  const cur = reg.findIndex(s => !s.on);
  const row = it => {
    const pill = `<span class="pill ${it.j==="Rukun"?"":"grey"}">${esc(jen(it.j))}</span>`;
    if(it.c){ const t = ksa(it.c.masa);
      return `<div class="it ok"><span class="no">&#10003;</span><div><div class="t">${esc(stepName(it))}${pill}</div><div class="d">${esc(t.hijri || t.tarikh)} <span>· ${t.hijri ? esc(t.tarikh) + ", " : ""}${esc(t.masa)} ${T("saudi")}</span></div>
        <div class="l ${it.c.dalam?"ok":""}">${it.c.dalam?"&#10003; ":""}${esc(tw(it.c.lokasi))} · ${it.c.dalam ? T("locok") : T("locrev")}</div></div>${evThumb(it.c) || `<div class="ph">-</div>`}</div>`; }
    const e = estimate(it.k, k.musim);
    return `<div class="it ${it.cur?"cur":""}"><span class="no">${it.no}</span><div><div class="t">${esc(stepName(it))}${pill}</div>${e ? `<div class="e">${T("est")}: ${esc(e)}</div>` : ""}</div><div class="ph">${it.cur ? T("nextph") : T("notyet")}</div></div>`;
  };
  $("app").innerHTML = `<div class="app">
  <header class="top"><div class="tin"><img class="lg" src="${LOGO_W}" alt="MKM Badal Haji"><div class="tt"><b>${T("portal")}</b>${T("portal2")}</div>
    <div class="lang" role="group" aria-label="Bahasa / Language"><button class="${LANG==="ms"?"on":""}" onclick="setLang('ms')">BM</button><button class="${LANG==="en"?"on":""}" onclick="setLang('en')">EN</button></div></div></header>
  <section class="hz"><div class="hin"><small>${T("for")}</small><h1>${esc(k.nama)}</h1><div class="chips"><span class="st">${stT}</span><span>${esc(k.ref)}</span><span>${LANG==="en"?"Hajj":"Haji"} ${esc(k.jenis_haji)} · ${esc(k.musim)}</span></div></div></section>
  <div class="pad lift">
    <section class="card pg"><div class="cb">
      <div class="row1"><b>${n}</b><span>${T("prog")(n, total)}</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      ${full ? `<div class="nxt ok"><span class="nn">&#10003;</span><div><div class="lb">${T("st_done")}</div><b>${T("alldone")}</b><small style="color:var(--ok)">${T("alldone2")}</small></div></div>`
        : nextIt ? `<div class="nxt"><span class="nn">${nextIt.no}</span><div><div class="lb">${T("next")}</div><b>${esc(stepName(nextIt))}</b><small>${T("est")}: ${esc(estimate(nextIt.k, k.musim))}</small></div></div>` : ""}
    </div></section>
    ${DEMO ? `<div class="demo">${T("demo")}</div>` : ""}
    ${full ? `<section class="card cert2" id="sijil"><h2>${T("cert")} <span class="pill ok">${T("st_done")}</span></h2><div class="cb"><p>${T("certp")}</p>
      <div class="dl"><button class="btn" onclick="pdfSijil(this)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>${T("dlc")}</button>
      <button class="btn ghost" onclick="pdfLaporan(this)">${T("dlr")}</button></div>${LANG==="en"?`<small>${T("certnote")}</small>`:""}</div></section>` : ""}
    <section class="card"><h2>${T("journey")} <span class="pill ${full?"ok":""}">${n}/${total}</span></h2><div class="cb">
      <div class="seg"><button class="${PHASE==="Umrah"?"on":""}" onclick="setPhase('Umrah')">${T("umrah")} <i class="${dU===U.length?"ok":""}">${dU}/${U.length}</i></button><button class="${PHASE==="Haji"?"on":""}" onclick="setPhase('Haji')">${T("haji")} <i class="${dH===H.length?"ok":""}">${dH}/${H.length}</i></button></div>
      <p class="tip">${T("tz")}</p>
      ${L.map(row).join("")}
    </div></section>
    <section class="card"><h2>${T("reg")}</h2><div class="cb"><div class="tl">${reg.map((s, i) => `<div class="r ${s.on?"on":i===cur?"cur":""}"><i>${s.on?"&#10003;":""}</i><b>${s.t}</b><small>${esc(s.s)}</small></div>`).join("")}</div></div></section>
    <section class="card"><h2>${T("ustaz")}</h2><div class="cb">${u ? `<div class="us">${avatar(u)}<div><b>${esc(u.nama)}</b><small>${esc(u.id)}</small></div></div>
        <div class="chips2">${u.haji ? `<span class="pill">${T("hajiown")(esc(u.haji))}</span>` : ""}<span class="pill ${u.permit==="Disahkan"?"ok":"grey"}">${T("permit")(esc(tw(u.permit || "Belum")))}</span></div>
        <dl class="kv2">${u.kelulusan ? `<dt>${T("kel")}</dt><dd>${esc(u.kelulusan)}</dd>` : ""}${u.pengalaman ? `<dt>${T("peng")}</dt><dd>${esc(u.pengalaman)}</dd>` : ""}${u.bahasa ? `<dt>${T("bhs")}</dt><dd>${esc(tw(u.bahasa))}</dd>` : ""}<dt>${T("assigned")}</dt><dd>${dtL(k.tarikh_ustaz)}</dd></dl>
        <div class="note2">${T("rule")}</div>` : `<p style="margin:0;color:var(--mute);font-size:13.5px">${T("noustaz")}</p>`}</div></section>
    <section class="card"><h2>${T("info")}</h2><div class="cb"><dl class="kv2" style="margin-top:0">
      <dt>${T("by")}</dt><dd>${esc(k.pendaftar)}</dd><dt>${T("rel")}</dt><dd>${esc(T("rel_of")(String(k.nama || "").replace(/^(allahyarham|allahyarhamah|almarhum|almarhumah)\s+/i, ""), tw(String(k.hubungan || "-")).toLowerCase()))}</dd>
      <dt>${T("regon")}</dt><dd>${dtL(k.tarikh)}</dd><dt>${T("pay")}</dt><dd>${k.paid ? rm(k.amaun) : esc(tw(k.status_bayaran || T("st_unpaid")))}</dd>${k.paid ? `<dt>${T("paidon")}</dt><dd>${dtL(k.tarikh_bayar)}</dd>` : ""}</dl></div></section>
    ${wa ? `<a class="btn wa waf" href="${wa}" target="_blank" rel="noopener"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/></svg>${T("wa")}</a>` : ""}
  </div>
  <div class="foot2">MKM Ticketing Travel &amp; Tours Sdn. Bhd. (964005-X) | Lesen MOTAC KPL6666<br>${LANG==="en"?"Hajj Pilgrim Manager appointed by Lembaga Tabung Haji":"Pengelola Jemaah Haji lantikan Lembaga Tabung Haji"}</div></div>`;
}
/* PDF sentiasa dalam Bahasa Melayu */
function withMs(fn){ const o = LANG; LANG = "ms"; try{ fn(); } finally { LANG = o; } }


/* ---------- PDF sijil (landskap) ---------- */
function pdfSijil(btn){ withMs(() => _pdfSijil(btn)); }
function _pdfSijil(btn){
  const m = model(), { k, u, done } = m;
  const d = key => { if(!done[key]) return "-"; const t = ksa(done[key].masa); return `${t.hijri ? t.hijri + "<br>" : ""}<span style="font-weight:500;color:#626A8C">${t.tarikh}</span>`; };
  const serif = "'Source Serif 4',Georgia,serif";

    <div style="width:120px;height:3px;background:#C80000;margin:22px auto 0"></div>
    <div style="font-family:${serif};font-size:42px;font-weight:700;color:#12206B;margin:18px 0 6px">Sijil Pelaksanaan Badal Haji</div>
    <div style="font-size:15px;color:#4a5072">Dengan ini disahkan bahawa ibadah haji telah disempurnakan bagi pihak</div>
    <div style="font-family:${serif};font-size:34px;font-weight:700;margin:12px 0 22px">${esc(k.nama)}</div>
    <table style="width:100%;border-collapse:collapse;font-size:13px;text-align:left">
      <tr><td style="padding:8px 12px;border:1px solid #DCE0EA;width:25%"><span style="color:#626A8C;font-size:11px">No. rujukan</span><br><b>${esc(k.ref)}</b></td><td style="padding:8px 12px;border:1px solid #DCE0EA;width:25%"><span style="color:#626A8C;font-size:11px">Musim</span><br><b>${esc(k.musim)}</b></td><td style="padding:8px 12px;border:1px solid #DCE0EA;width:25%"><span style="color:#626A8C;font-size:11px">Jenis haji</span><br><b>Haji ${esc(k.jenis_haji)}</b></td><td style="padding:8px 12px;border:1px solid #DCE0EA;width:25%"><span style="color:#626A8C;font-size:11px">Dilaksanakan oleh</span><br><b>${esc(u ? u.nama : "-")}</b></td></tr>
      <tr><td style="padding:8px 12px;border:1px solid #DCE0EA"><span style="color:#626A8C;font-size:11px">Ihram umrah</span><br><b>${d("ihram_umrah")}</b></td><td style="padding:8px 12px;border:1px solid #DCE0EA"><span style="color:#626A8C;font-size:11px">Wukuf di Arafah</span><br><b>${d("wukuf")}</b></td><td style="padding:8px 12px;border:1px solid #DCE0EA"><span style="color:#626A8C;font-size:11px">Tawaf Ifadah</span><br><b>${d("ifadah")}</b></td><td style="padding:8px 12px;border:1px solid #DCE0EA"><span style="color:#626A8C;font-size:11px">Tawaf Wada'</span><br><b>${d("wada")}</b></td></tr>
    </table>
    <div style="font-family:'Source Serif 4',Georgia,serif;font-style:italic;font-size:15px;color:#12206B;margin-top:22px">${k.status_d === "Meninggal dunia" ? "Semoga Allah SWT menerima ibadah ini dan mencucuri rahmat ke atas roh beliau." : "Semoga Allah SWT menerima ibadah ini dan mengurniakan kesihatan kepada beliau."}</div>
    <div style="position:absolute;left:70px;right:70px;bottom:34px;display:flex;justify-content:space-between;align-items:flex-end;font-size:12px;color:#4a5072">
      <div style="width:220px;border-top:1px solid #151A3A;padding-top:6px">Penyelia Syariah MKM</div>
      <div style="font-size:11px;color:#8A90AA">Dijana ${esc(dtt(new Date().toISOString()))}<br>Pemohon: ${esc(k.pendaftar)}</div>
      <div style="width:220px;border-top:1px solid #151A3A;padding-top:6px">Pengurus Jabatan Haji MKM</div></div>
  </div></div></div>`;
  makePdf(html, 1123, "landscape", `Sijil-Badal-Haji-${k.ref}.pdf`, btn);
}

/* ---------- PDF laporan penuh (potret) ---------- */
function pdfLaporan(btn){ withMs(() => _pdfLaporan(btn)); }
function _pdfLaporan(btn){
  const m = model(), { k, u, items, n, total } = m;
  const th = "padding:7px 8px;border:1px solid #12206B;background:#12206B;color:#fff;font-size:10.5px;text-align:left";
  const td = "padding:7px 8px;border:1px solid #DCE0EA;font-size:10.5px;vertical-align:top";
  const rows = f => `<tr><td colspan="6" style="${td};background:#EEF1FB;font-weight:800;color:#12206B">${f === "Umrah" ? "Fasa Umrah (Tamattu')" : "Fasa Haji"}</td></tr>` + items.filter(i => i.f === f).map(it => {
    const t = it.c ? ksa(it.c.masa) : null;
    return `<tr><td style="${td};width:26px;font-weight:800;color:#12206B">${it.no}</td><td style="${td}"><b>${esc(it.n)}</b><br><span style="color:#626A8C">${it.j}</span></td>
      <td style="${td}">${t ? esc(t.hijri || "-") : "-"}</td><td style="${td}">${t ? esc(t.tarikh + ", " + t.masa) : "-"}</td><td style="${td}">${it.c ? esc(it.c.lokasi) + "" : "-"}</td><td style="${td}">${it.c ? (it.c.bukti ? esc(it.c.jenis || "Ada") : "-") : "Belum"}</td></tr>`;
  }).join("");
  const kv = (a, b) => `<tr><td style="${td};width:170px;background:#F6F7FB;color:#626A8C">${a}</td><td style="${td}">${b}</td></tr>`;
  const html = `<div style="width:794px;padding:38px 44px;box-sizing:border-box;background:#fff;font-family:'Plus Jakarta Sans',Arial,sans-serif;color:#151A3A">
    <div style="display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #C80000;padding-bottom:12px"><img src="${LOGO_C}" style="height:52px;width:auto"><div style="text-align:right;font-size:10.5px;color:#626A8C">MKM Ticketing Travel &amp; Tours Sdn. Bhd. (964005-X)<br>Lesen MOTAC KPL6666</div></div>
    <div style="font-family:'Source Serif 4',Georgia,serif;font-size:24px;font-weight:700;color:#12206B;margin:18px 0 2px">Laporan Perjalanan Badal Haji</div>
    <div style="font-size:11.5px;color:#626A8C;margin-bottom:14px">No. rujukan ${esc(k.ref)} | Musim ${esc(k.musim)} | Dijana ${esc(dtt(new Date().toISOString()))}</div>
    <table style="width:100%;border-collapse:collapse;margin-bottom:14px">${kv("Orang yang dibadalkan", `<b>${esc(k.nama)}</b>`)}${kv("Jenis haji", "Haji " + esc(k.jenis_haji))}${kv("Pendaftar", esc(k.pendaftar) + " (" + esc(k.hubungan || "-") + ")")}${kv("Pengendali", u ? `${esc(u.nama)} (${esc(u.id)}), haji fardu ${esc(u.haji || "-")}` : "-")}${kv("Status", `${n} daripada ${total} rukun dan wajib selesai`)}</table>
    <table style="width:100%;border-collapse:collapse"><thead><tr><th style="${th}">No</th><th style="${th}">Rukun / wajib</th><th style="${th}">Tarikh Hijrah</th><th style="${th}">Tarikh & masa (waktu Saudi)</th><th style="${th}">Lokasi</th><th style="${th}">Bukti</th></tr></thead><tbody>${rows("Umrah")}${rows("Haji")}</tbody></table>
    <p style="font-size:10px;color:#626A8C;margin:14px 0 0">Laporan dijana secara automatik daripada sistem badal haji MKM. Setiap rekod dibuat oleh pengendali di lokasi bersama bukti gambar atau video, masa dan lokasi GPS. Bukti asal boleh dilihat di portal penjejakan.</p></div>`;
  makePdf(html, 794, "portrait", `Laporan-Badal-Haji-${k.ref}.pdf`, btn);
}

boot();
</script>
